    .check,.next,.secondary{border:0;border-radius:12px;padding:10px 16px;font-weight:800}.check,.next{background:var(--purple);color:#fff}.secondary{background:#efedf7;color:#51478b}.task-actions,.footer-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}.flashgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(185px,1fr));gap:12px}.flash{min-height:122px;border:0;border-radius:15px;background:#fff0df;border:1px solid #f3c898;padding:15px;text-align:left;color:var(--ink)}.flash .back{display:none}.flash.flipped{background:var(--mint)}.flash.flipped .front{display:none}.flash.flipped .back{display:block}.tag{display:inline-block;font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--orange);font-weight:900;margin-bottom:7px}.builder{display:flex;flex-wrap:wrap;gap:8px;min-height:46px;padding:8px;border:1px dashed #bbb6d7;border-radius:12px}.word{border:0;background:#eeeaff;color:#5041a7;border-radius:9px;padding:7px 10px}.word.used{opacity:.35}.answerline{min-height:44px;background:#faf9fd;border-radius:11px;padding:9px;margin-bottom:9px}.result-hero{text-align:center;padding:25px;background:linear-gradient(135deg,#eeeaff,#e7f7ef);border-radius:18px}.result-hero .big{font-size:48px;font-weight:900;color:#5d4cc4}.skills{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}.skill{border:1px solid var(--line);border-radius:13px;padding:13px}.skilltop{display:flex;justify-content:space-between;font-weight:700}.skillbar{height:7px;background:#ececf2;border-radius:99px;margin-top:8px;overflow:hidden}.skillbar i{display:block;height:100%;background:var(--purple)}.note{font-size:13px;color:var(--muted)}.hidden{display:none!important}.speak{background:#fff8ca;border:1px solid #eadb70;padding:18px;border-radius:15px}.checklist label{display:block;margin:8px 0}.review-item{border-left:4px solid var(--orange);background:#fff7ee;padding:12px;margin:10px 0;border-radius:0 12px 12px 0}
    @media(max-width:820px){.layout{grid-template-columns:1fr}.side{position:static;display:flex;overflow:auto;white-space:nowrap;padding:8px}.navbtn{width:auto}.navbtn span:last-child{display:none}.top{grid-template-columns:1fr}.scorebox{text-align:left}.panel{padding:20px}.app{padding:10px}}

<body>
<div class="app">
  <header class="top">
    <div><div class="eyebrow">American English File 03</div><h1>Units 1A–1B Revision</h1><p class="subtitle">Review food, family, future forms, personality, stative verbs and Julia’s personal vocabulary.</p></div>
    <div class="scorebox"><span>Progress</span><b id="progressText">0%</b><div class="bar"><i id="progressBar"></i></div></div>
  </header>
  <div class="layout">
    <nav class="side" id="nav"></nav>
    <main id="main"></main>
  </div>
</div>
<script>
const sections=[
 {id:'start',title:'Quick Start'}, {id:'have',title:'Have / Has'}, {id:'orange',title:'Personal Vocabulary'},
 {id:'see',title:'See & Mean'}, {id:'food',title:'Food & Habits'}, {id:'family',title:'Family'},
 {id:'personality',title:'Personality'}, {id:'future',title:'Future Forms'}, {id:'mistakes',title:'Mistake Lab'},
 {id:'final',title:'Final Challenge'}, {id:'results',title:'Results'}
];
const state=JSON.parse(localStorage.getItem('juliaRevisionV1')||'{"answers":{},"checked":{},"done":{}}');
const qs={
 start:[
  ['s1','I don’t know what it ___.',['mean','means','does mean'],1,'After a question phrase inside a sentence, use normal word order: what it means.'],
  ['s2','My boyfriend ___ a very close-knit family.',['have','has','is'],1,'Use has with he, she and it.'],
  ['s3','Look at those clouds! It ___.',['will rain','is going to rain','rains'],1,'Use be going to for a prediction based on present evidence.'],
  ['s4','I usually ___ English podcasts.',['listen','listen to','am listening to'],1,'Listen needs the preposition to.'],
  ['s5','He always keeps his promises. He’s very ___.',['sensitive','reliable','bossy'],1,'Reliable means that you can depend on someone.'],
  ['s6','I’ve booked an appointment. I ___ the dentist tomorrow.',['see','am seeing','will see'],1,'Present Continuous describes an arranged future event.']
 ],
 have:[
  ['h1','Julia ___ a small immediate family.',['have','has'],1,'Julia = she, so use has.'],
  ['h2','Her relatives ___ a lot in common.',['have','has'],0,'Relatives is plural, so use have.'],
  ['h3','She ___ any brothers or sisters.',['doesn’t have','doesn’t has','hasn’t'],0,'In Present Simple use doesn’t have. After doesn’t, use the base form.'],
  ['h4','___ your boyfriend have a large family?',['Do','Does','Has'],1,'Use Does + subject + have with he/she/it.'],
  ['h5','I ___ any time to cook today.',['haven’t','don’t have','doesn’t have'],1,'For possession in this course, use don’t have.'],
  ['h6','Does this job ___ an influence on your routine?',['have','has','having'],0,'After does, use the base form have.'],
  ['h7','My parents ___ responsible for this decision.',['have','are','has'],1,'Responsible is an adjective: be responsible for.'],
  ['h8','He ___ much in common with his relatives.',['don’t have','doesn’t has','doesn’t have'],2,'Use doesn’t have with he.']
 ],
 orange:[
  ['o1','You wash your hands with ___.',['soap','soup'],0,'Soap /soʊp/ is used for washing. Soup /suːp/ is food.'],
  ['o2','A person who helps sick animals is a ___.',['wet','vet'],1,'Vet begins with /v/: the top teeth touch the lower lip.'],
  ['o3','We need some ___ to make pizza.',['dough','purchase','cereal'],0,'Dough /doʊ/ is a mixture used to make bread or pizza.'],
  ['o4','We watched a ___ at the theatre.',['ballet','café','kindergarten'],0,'Ballet is a dance performance.'],
  ['o5','She works as a ___.',['nail technician','measles outbreak','purchase'],0,'A nail technician is a person who does manicures and nail treatments.'],
  ['o6','I often ___ with my friends after work.',['hang out','hung out','hang on'],0,'Use hang out for a present habit.'],
  ['o7','We ___ at a café last Saturday.',['hang out','hung out','hanged out'],1,'The past form of hang out is hung out.'],
  ['o8','There have been several ___ in the area.',['measles outbreaks','measles outbrakes','measle outbreaks'],0,'The correct phrase is measles outbreaks.'],
  ['o9','He worries that he isn’t good enough. He feels ___.',['naive','insecure','mature'],1,'Insecure means not confident about yourself.'],
  ['o10','Birth order can ___ personality.',['influence on','influence','have influence'],1,'Influence is a transitive verb: influence something, with no preposition.'],
  ['o11','Birth order can have an influence ___ personality.',['to','on','for'],1,'The noun phrase is have an influence on.'],
  ['o12','She is responsible ___ customer service.',['of','for','on'],1,'The fixed phrase is be responsible for.']
 ],
 see:[
  ['e1','I can ___ a café across the street.',['see','am seeing'],0,'See means notice with your eyes here, so it is stative.'],
  ['e2','I ___ my nail technician tomorrow.',['see','am seeing'],1,'Here see means meet by arrangement, so Present Continuous is natural.'],
  ['e3','I ___ what you mean.',['see','am seeing'],0,'See can mean understand. It is stative here.'],
  ['e4','She ___ her boyfriend tonight.',['sees','is seeing'],1,'This is an arrangement.'],
  ['e5','What ___ “dough” mean?',['do','does','is'],1,'Use What does + subject + base verb?'],
  ['e6','I know ___.',['what does it mean','what it means','what means it'],1,'An embedded question uses statement word order.'],
  ['e7','Can you tell me ___?',['what does “naive” mean','what “naive” means','what means “naive”'],1,'After Can you tell me..., use normal word order.']
 ],
 food:[
  ['f1','I eat ___ for breakfast.',['serial','cereal','pastry shop'],1,'Cereal is breakfast food. Serial means серийный.'],
  ['f2','We bought bread at a local ___.',['bakery','pastry','ballet'],0,'A bakery is a place. A pastry is a food item.'],
  ['f3','The chef ___ the sauce right now.',['tastes','is tasting'],1,'Is tasting means the chef is checking the flavor now.'],
  ['f4','This soup ___ strange.',['is tasting','tastes'],1,'Taste describes the soup’s state here.'],
  ['f5','I ___ spicy food is delicious.',['think','am thinking'],0,'Think = believe is normally stative.'],
  ['f6','I ___ cutting down on coffee.',['think','am thinking about'],1,'Think about = consider, so the continuous form is possible.'],
  ['f7','These days, I ___ takeout more often.',['order','am ordering'],1,'These days signals a temporary changing situation.'],
  ['f8','I can eat pizza, but I don’t like ___.',['it','this','–'],0,'Like is transitive here, so it needs the object it.']
 ],
 family:[
  ['a1','I’m especially close ___ my dad.',['with','to','on'],1,'Be close to someone.'],
  ['a2','I get along well ___ my relatives.',['to','with','on'],1,'Get along with someone.'],
  ['a3','I have a lot ___ common ___ my mum.',['in / with','of / to','in / to'],0,'Have a lot in common with someone.'],
  ['a4','I probably take ___ my father.',['on','after','of'],1,'Take after someone means be similar to an older relative.'],
  ['a5','I can always rely ___ my family.',['to','with','on'],2,'Rely on someone.'],
  ['a6','We keep ___ touch via messaging apps.',['on','at','in'],2,'Keep in touch.'],
  ['a7','She looks ___ her grandmother.',['after','at','for'],0,'Look after means take care of.'],
  ['a8','We sometimes argue ___ money.',['with','about','for'],1,'Argue with a person about a topic.'],
  ['a9','Parents, children and siblings are your ___.',['extended family','immediate family','in-laws'],1,'Immediate family includes parents, children and siblings.'],
  ['a10','Your husband’s or wife’s family are your ___.',['in-laws','siblings','only children'],0,'In-laws are your spouse’s relatives.']
 ],
 personality:[
  ['p1','She always does what she promises. She’s ___.',['reliable','sensitive','bossy'],0,'Reliable means dependable.'],
  ['p2','He enjoys meeting new people. He’s ___.',['sociable','stubborn','insecure'],0,'Sociable people enjoy spending time with others.'],
  ['p3','She is easily hurt by criticism. She’s ___.',['sensible','sympathetic','sensitive'],2,'Sensitive = easily affected or hurt.'],
  ['p4','He was kind and understanding when I had a problem. He was ___.',['sympathetic','sensitive','sensible'],0,'Sympathetic = kind and understanding when someone has a problem.'],
  ['p5','It was practical and showed good judgment. It was a ___ decision.',['sensitive','sensible','sympathetic'],1,'Sensible = practical and able to make good decisions.'],
  ['p6','She wants to run her own company. She’s ___.',['ambitious','anxious','moody'],0,'Ambitious people are determined to be successful.'],
  ['p7','He often changes from happy to unhappy. He’s ___.',['charming','moody','mature'],1,'Moody means often changing from happy to unhappy.'],
  ['p8','She can manage without help. She’s ___.',['independent','bossy','naive'],0,'Independent = able to manage without help.'],
  ['p9','The opposite of reliable is ___.',['inreliable','unreliable','disreliable'],1,'Use the prefix un-: unreliable.'],
  ['p10','The opposite of patient is ___.',['impatient','unpatient','dispatient'],0,'Use the prefix im-: impatient.']
 ],
 future:[
  ['u1','I’ve decided to eat more healthily. I ___ at home more often.',['will cook','am going to cook','am cooking'],1,'A decision made before speaking is an intention: be going to.'],
  ['u2','We’ve booked a table. We ___ dinner at 8.',['are having','will have','have'],0,'A booked arrangement uses Present Continuous.'],
  ['u3','Look at that car! It ___.',['will crash','is going to crash','crashes'],1,'There is present evidence, so use be going to.'],
  ['u4','I think the lesson ___ interesting.',['is going to be','will be','is being'],1,'A prediction based on opinion commonly uses will.'],
  ['u5','Your bag looks heavy. I ___ it.',['am going to carry','carry','will carry'],2,'This is an offer made now, so use will.'],
  ['u6','I promise I ___ anyone.',['am not telling','won’t tell','don’t tell'],1,'Promises use will / won’t.'],
  ['u7','I have an appointment. I ___ the doctor tomorrow.',['will see','am seeing','see'],1,'An arrangement uses Present Continuous.'],
  ['u8','There’s no food at home. I ___ takeout.',['order','am ordering','will order'],2,'This is an instant decision, so use will.'],
  ['u9','What ___ this weekend?',['are you going to do','will you do','do you do'],0,'Ask about an existing plan with be going to.']
 ],
 mistakes:[
  ['m1','Choose the correct sentence.',['I listen English podcasts.','I listen to English podcasts.'],1,'Listen is followed by to.'],
  ['m2','Choose the correct sentence.',['I don’t eat bakeries.','I don’t eat pastries.'],1,'A bakery is a place; a pastry is food.'],
  ['m3','Choose the correct sentence.',['I haven’t any time to cook.','I don’t have any time to cook.'],1,'Use don’t have for Present Simple possession.'],
  ['m4','Choose the correct sentence.',['I already told you that I love it.','I already told that I love it.'],0,'Tell normally needs a person: tell someone something.'],
  ['m5','Choose the correct sentence.',['My boyfriend end up ordering pizza.','My boyfriend ends up ordering pizza.'],1,'With he/she/it in Present Simple, add -s: ends up.'],
  ['m6','Choose the correct sentence.',['He is a wet. He helps animals.','He is a vet. He helps animals.'],1,'Vet means an animal doctor. Wet means not dry.'],
  ['m7','Choose the correct sentence.',['He doesn’t close to his relatives.','He isn’t close to his relatives.'],1,'Close is an adjective here, so use be.'],
  ['m8','Choose the correct sentence.',['He doesn’t take after any of his relatives.','He doesn’t takes after anybody of his relatives.'],0,'After doesn’t, use the base form. Any of his relatives is natural here.'],
  ['m9','Choose the correct sentence.',['As I got older, we became closer.','When I became older, we started to be closer.'],0,'As I got older, we became closer is the natural phrasing.'],
  ['m10','Choose the correct sentence.',['We keep in touch via messaging apps and by phone.','We keep in touch in messengers and phone.'],0,'Use via messaging apps and by phone.']
 ]
};

function mcTask(title,items){return `<div class="task"><p class="task-title">${title}</p>${items.map(q=>`<div class="q" data-q="${q[0]}"><p class="prompt">${q[1]}</p><div class="options">${q[2].map((o,i)=>`<button class="opt" data-i="${i}">${o}</button>`).join('')}</div><div class="feedback"></div></div>`).join('')}<div class="task-actions"><button class="check">Check answers</button><button class="secondary reset-task">Try again</button></div></div>`}
function flashcards(){const cards=[['кафе','café /kæˈfeɪ/'],['балет','ballet /ˈbæleɪ/'],['тесто','dough /doʊ/'],['покупка','a purchase'],['мастер по маникюру','a nail technician'],['чувствовать себя неуверенно','feel insecure'],['вспышка кори','a measles outbreak'],['детский сад','kindergarten'],['вероятно','probably'],['наивный','naive / naïve'],['тусоваться с кем-то','hang out with someone'],['быть ответственным за','be responsible for'],['иметь влияние на','have an influence on'],['влиять на','influence']];return `<div class="task"><p class="task-title">Task 3 – Review the cards. Click to flip.</p><div class="flashgrid">${cards.map(c=>`<button class="flash"><span class="front"><span class="tag">Russian</span><br>${c[0]}</span><span class="back"><span class="tag">English</span><br><b>${c[1]}</b></span></button>`).join('')}</div></div>`}
function haveRule(){return `<div class="rule"><b>Have / has in the Present Simple</b><table class="mini-table"><tr><th></th><th>Positive</th><th>Negative</th><th>Question</th></tr><tr><td>I / you / we / they</td><td>I <b>have</b> time.</td><td>I <b>don’t have</b> time.</td><td><b>Do</b> you <b>have</b> time?</td></tr><tr><td>he / she / it</td><td>She <b>has</b> time.</td><td>She <b>doesn’t have</b> time.</td><td><b>Does</b> she <b>have</b> time?</td></tr></table><p class="note">After <b>does</b> or <b>doesn’t</b>, always use <b>have</b>, not has.</p></div>`}
function textTask(){const data=[['t1','У меня сегодня нет времени готовить.','i don’t have any time to cook today|i do not have any time to cook today|i don’t have time to cook today'],['t2','У неё есть братья или сёстры?','does she have any brothers or sisters|does she have any siblings'],['t3','У вас с мамой много общего?','do you have a lot in common with your mum|do you have a lot in common with your mom'],['t4','У этой работы большое влияние на мою жизнь.','this job has a big influence on my life|this job has a strong influence on my life'],['t5','За что он отвечает?','what is he responsible for'],['t6','Во сколько ты завтра встречаешься с врачом?','what time are you seeing the doctor tomorrow|what time are you meeting the doctor tomorrow'],['t7','Я знаю, что это значит.','i know what it means'],['t8','Что значит insecure?','what does insecure mean|what does “insecure” mean']];return `<div class="task"><p class="task-title">Task 10 – Translate into English.</p>${data.map(x=>`<div class="q textq" data-q="${x[0]}" data-a="${x[2]}"><p class="prompt">${x[1]}</p><div class="text-answer"><input autocomplete="off" placeholder="Type your answer"><button class="check-one check">Check</button></div><div class="feedback"></div></div>`).join('')}</div>`}
function finalSection(){return `<section class="panel" id="final"><h2>Final Challenge</h2><p class="lead">Bring the whole unit together in one answer.</p><div class="speak"><p class="task-title">Task 11 – Describe one important person in your life.</p><p>Speak for 1–2 minutes. Include:</p><ul><li>who this person is and what they do</li><li>two personality adjectives with reasons</li><li>your relationship and what you have in common</li><li>how this person influences you</li><li>what you usually do together</li><li>one plan, one arrangement and one prediction</li></ul><div class="checklist"><label><input type="checkbox"> I used <b>have / has</b> correctly</label><label><input type="checkbox"> I used <b>don’t / doesn’t have</b></label><label><input type="checkbox"> I used a family expression</label><label><input type="checkbox"> I used two personality adjectives</label><label><input type="checkbox"> I used two different future forms</label><label><input type="checkbox"> I gave reasons and examples</label></div><button class="check" id="finishFinal">Mark as complete</button></div></section>`}
function resultsSection(){return `<section class="panel" id="results"><h2>Your Results</h2><p class="lead">See what is secure and what needs one more round.</p><div class="result-hero"><div class="big" id="resultScore">0%</div><div id="resultMsg">Complete the activities to see your result.</div></div><h3>Progress by area</h3><div class="skills" id="skills"></div><div id="reviewList"></div><div class="footer-actions"><button class="check" id="reviewMistakes">Review my mistakes</button><button class="secondary" id="resetAll">Reset all progress</button></div></section>`}
function panel(id,title,lead,content){return `<section class="panel" id="${id}"><h2>${title}</h2><p class="lead">${lead}</p>${content}<div class="footer-actions"><button class="next">Continue</button></div></section>`}
function build(){
 document.getElementById('nav').innerHTML=sections.map((s,i)=>`<button class="navbtn" data-go="${s.id}"><span class="num">${i+1}</span><span>${s.title}</span></button>`).join('');
 document.getElementById('main').innerHTML=
 panel('start','Quick Start','Answer without checking your notes. This will show what you already remember.',mcTask('Task 1 – Choose the best answer.',qs.start))+
 panel('have','Have / Has','Build positive sentences, negatives and questions.',haveRule()+mcTask('Task 2 – Choose the correct form.',qs.have))+
 panel('orange','Personal Vocabulary','Review the words from the orange notes, then use them in context.',flashcards()+mcTask('Task 4 – Choose the correct word or phrase.',qs.orange))+
 panel('see','See & Mean','Notice how meaning changes grammar and word order.',`<div class="rule orange"><b>see</b> can mean <i>видеть, понимать, встречаться / встречать</i>.<br><b>What does it mean?</b> is a direct question.<br><b>I know what it means.</b> has normal statement word order.</div>`+mcTask('Task 5 – Choose the correct option.',qs.see))+
 panel('food','Food & Habits','Review food vocabulary and Present Simple vs Present Continuous.',mcTask('Task 6 – Choose the correct option.',qs.food))+
 panel('family','Family & Relationships','Complete the expressions and check the prepositions.',mcTask('Task 7 – Choose the correct option.',qs.family))+
 panel('personality','Personality','Choose precise adjectives and remember negative prefixes.',mcTask('Task 8 – Choose the best adjective.',qs.personality))+
 panel('future','Future Forms','Choose between be going to, Present Continuous and will.',`<div class="rule"><b>be going to</b> – a plan or evidence now<br><b>Present Continuous</b> – an arrangement<br><b>will</b> – an instant decision, offer, promise or opinion prediction</div>`+mcTask('Task 9 – Choose the most natural future form.',qs.future))+
 panel('mistakes','Julia’s Mistake Lab','Repair the real mistakes from homework and speaking.',mcTask('Task 10 – Choose the correct sentence.',qs.mistakes)+textTask())+
 finalSection()+resultsSection();
 bind();restore();show('start');updateProgress();
}
function allQuestions(){return Object.values(qs).flat()}
function norm(s){return s.toLowerCase().trim().replace(/[’]/g,"'").replace(/[.!?]/g,'').replace(/\s+/g,' ')}
function bind(){
 document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>show(b.dataset.go));
 document.querySelectorAll('.next').forEach(b=>b.onclick=()=>{const p=b.closest('.panel');const i=sections.findIndex(s=>s.id===p.id);show(sections[Math.min(i+1,sections.length-1)].id)});
 document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{const q=b.closest('.q');q.querySelectorAll('.opt').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');state.answers[q.dataset.q]=+b.dataset.i;save()});
 document.querySelectorAll('.task .check').forEach(b=>{if(!b.classList.contains('check-one'))b.onclick=()=>checkTask(b.closest('.task'))});
 document.querySelectorAll('.reset-task').forEach(b=>b.onclick=()=>resetTask(b.closest('.task')));
 document.querySelectorAll('.flash').forEach(b=>b.onclick=()=>b.classList.toggle('flipped'));
 document.querySelectorAll('.check-one').forEach(b=>b.onclick=()=>checkText(b.closest('.textq')));
 document.querySelectorAll('.textq input').forEach(i=>i.oninput=()=>{state.answers[i.closest('.q').dataset.q]=i.value;save()});
 document.getElementById('finishFinal').onclick=()=>{state.done.final=true;save();updateProgress();show('results')};
 document.getElementById('reviewMistakes').onclick=()=>{const bad=wrongQuestions(); if(!bad.length)return; const first=bad[0]; const sec=sectionFor(first);show(sec);document.querySelector(`[data-q="${first}"]`)?.scrollIntoView({behavior:'smooth',block:'center'})};
 document.getElementById('resetAll').onclick=()=>{if(confirm('Reset all answers and progress?')){localStorage.removeItem('juliaRevisionV1');location.reload()}};
}
function show(id){document.querySelectorAll('.panel').forEach(x=>x.classList.toggle('active',x.id===id));document.querySelectorAll('.navbtn').forEach(x=>x.classList.toggle('active',x.dataset.go===id));window.scrollTo({top:0,behavior:'smooth'});if(id==='results')renderResults()}
function checkTask(task){task.querySelectorAll('.q:not(.textq)').forEach(q=>checkMC(q));updateProgress()}
function checkMC(el){const item=allQuestions().find(q=>q[0]===el.dataset.q);if(!item)return;const chosen=state.answers[item[0]];if(chosen===undefined)return;state.checked[item[0]]=true;el.querySelectorAll('.opt').forEach((b,i)=>{b.classList.remove('correct','wrong');if(i===item[3])b.classList.add('correct');else if(i===chosen)b.classList.add('wrong')});const ok=chosen===item[3],fb=el.querySelector('.feedback');fb.className='feedback show '+(ok?'ok':'no');fb.innerHTML=(ok?'<b>Correct.</b> ':'<b>Not quite.</b> ')+item[4];save()}
function checkText(el){const val=el.querySelector('input').value;state.answers[el.dataset.q]=val;state.checked[el.dataset.q]=true;const ok=el.dataset.a.split('|').some(a=>norm(a)===norm(val));const fb=el.querySelector('.feedback');fb.className='feedback show '+(ok?'ok':'no');fb.innerHTML=ok?'<b>Correct.</b>':'<b>Suggested answer:</b> '+el.dataset.a.split('|')[0];save();updateProgress()}
function resetTask(task){task.querySelectorAll('.q').forEach(el=>{delete state.answers[el.dataset.q];delete state.checked[el.dataset.q];el.querySelectorAll('.opt').forEach(b=>b.classList.remove('selected','correct','wrong'));const inp=el.querySelector('input');if(inp)inp.value='';el.querySelector('.feedback')?.classList.remove('show')});save();updateProgress()}
function restore(){document.querySelectorAll('.q').forEach(el=>{const id=el.dataset.q;if(state.answers[id]!==undefined){if(el.classList.contains('textq'))el.querySelector('input').value=state.answers[id];else el.querySelector(`[data-i="${state.answers[id]}"]`)?.classList.add('selected')}if(state.checked[id]){if(el.classList.contains('textq'))checkText(el);else checkMC(el)}});document.querySelectorAll('#final input').forEach(x=>x.checked=!!state.done.final)}
function save(){localStorage.setItem('juliaRevisionV1',JSON.stringify(state))}
function textQuestions(){return [...document.querySelectorAll('.textq')].map(e=>e.dataset.q)}
function isCorrect(id){const q=allQuestions().find(x=>x[0]===id);if(q)return state.answers[id]===q[3];const el=document.querySelector(`[data-q="${id}"]`);return el&&el.dataset.a.split('|').some(a=>norm(a)===norm(state.answers[id]||''))}
function wrongQuestions(){return Object.keys(state.checked).filter(id=>state.checked[id]&&!isCorrect(id))}
function sectionFor(id){for(const [k,v] of Object.entries(qs))if(v.some(x=>x[0]===id))return k==='mistakes'?'mistakes':k;return 'mistakes'}
function updateProgress(){const total=allQuestions().length+textQuestions().length+1;const checked=Object.keys(state.checked).length+(state.done.final?1:0);const pct=Math.round(checked/total*100);document.getElementById('progressText').textContent=pct+'%';document.getElementById('progressBar').style.width=pct+'%';sections.forEach(s=>{if(qs[s.id]){const ids=qs[s.id].map(x=>x[0]);document.querySelector(`[data-go="${s.id}"]`)?.classList.toggle('done',ids.every(id=>state.checked[id]))}});save()}
function renderResults(){const ids=Object.keys(state.checked);const right=ids.filter(isCorrect).length;const pct=ids.length?Math.round(right/ids.length*100):0;document.getElementById('resultScore').textContent=pct+'%';document.getElementById('resultMsg').textContent=ids.length<20?'Keep going – complete more tasks for a reliable result.':pct>=90?'Excellent – the material is becoming automatic.':pct>=75?'Strong result – review a few details.':'Good start – review the explanations and try the difficult items again.';const labels={start:'Quick Start',have:'Have / Has',orange:'Personal Vocabulary',see:'See & Mean',food:'Food & Habits',family:'Family',personality:'Personality',future:'Future Forms',mistakes:'Mistake Lab'};document.getElementById('skills').innerHTML=Object.keys(labels).map(k=>{const qids=qs[k].map(x=>x[0]).filter(id=>state.checked[id]);const p=qids.length?Math.round(qids.filter(isCorrect).length/qids.length*100):0;return `<div class="skill"><div class="skilltop"><span>${labels[k]}</span><span>${p}%</span></div><div class="skillbar"><i style="width:${p}%"></i></div></div>`}).join('');const wrong=wrongQuestions();document.getElementById('reviewList').innerHTML=wrong.length?`<h3>Review these points</h3>${wrong.slice(0,12).map(id=>{const q=allQuestions().find(x=>x[0]===id);return `<div class="review-item"><b>${q?q[1]:'Translation item'}</b><br><span class="note">${q?q[4]:'Check the suggested answer again.'}</span></div>`}).join('')}`:'<div class="rule"><b>No checked mistakes.</b> Complete the activities or celebrate a perfect result.</div>'}
build();
</script>
</body>
</html>
