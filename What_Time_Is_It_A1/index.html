<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>What Time Is It? · A1</title>
<style>
:root{--bg:#f4f5fc;--paper:#fff;--ink:#252640;--muted:#666d89;--purple:#6956d5;--soft:#f1eeff;--line:#dfe1f0;--blue:#edf5ff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.6 Arial,sans-serif}main{max-width:920px;margin:auto;padding:35px 20px 60px}header p{color:var(--muted);margin:8px 0}h1{font-size:clamp(33px,6vw,49px);line-height:1.1;margin:10px 0 18px}h2{font-size:25px;line-height:1.3}h3{font-size:19px}button,input{font:inherit}button{cursor:pointer;border:1px solid transparent;border-radius:12px;background:var(--purple);color:white;font-weight:650;padding:11px 16px}button.secondary{background:var(--soft);color:#4e3ca7;border-color:var(--line)}button:disabled{opacity:.5;cursor:default}:focus-visible{outline:3px solid #a396e5;outline-offset:3px}nav{display:flex;gap:7px;flex-wrap:wrap;margin:20px 0}nav button{font-size:14px;padding:7px 11px}nav button[aria-current=step]{background:var(--purple);color:white}.track{height:9px;border-radius:12px;overflow:hidden;background:#e2e3f0;margin:18px 0 8px}.track i{height:100%;display:block;background:var(--purple);width:0}.small{font-size:14px;color:var(--muted)}.panel{border:1px solid var(--line);background:white;border-radius:23px;padding:clamp(18px,4vw,35px)}.actions{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0}.page-actions{justify-content:space-between}.rule{background:var(--soft);border-radius:14px;padding:18px;margin:15px 0}.big{font-size:26px;font-weight:700;color:#5140b4}.examples{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.example{border:1px solid var(--line);border-radius:14px;padding:14px;text-align:center}.example p{margin:5px 0}.clock{display:block;width:245px;max-width:100%;margin:18px auto}.example .clock{width:135px;margin:8px auto}.prompt{font-size:22px;font-weight:650;white-space:pre-line}.digital{font-size:43px;color:#5344ac;font-weight:750;text-align:center;margin:20px 0}.options{display:grid;gap:9px;margin:18px 0}.option{text-align:left;background:#f9f9fe;color:var(--ink);border-color:var(--line);font-weight:500}.option.selected{border-color:var(--purple);box-shadow:0 0 0 1px var(--purple);background:var(--soft)}input{width:100%;border:1px solid #bfc2da;padding:13px;border-radius:11px;margin:18px 0 5px;color:var(--ink)}.feedback{background:var(--blue);padding:14px;border-radius:12px;margin:18px 0}.feedback.good{background:#e6f4ed;color:#285740}.feedback.bad{background:#fff0ec;color:#753d32}.feedback p{margin:8px 0}.sentence{padding:14px;background:var(--soft);border-radius:12px;min-height:60px;display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}.bank{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.word{background:white;border-color:#cac4e5;color:var(--ink);font-weight:500}.score{font-size:52px;font-weight:750;line-height:1.2}.notice{padding:15px;border-radius:12px;background:var(--blue)}.mistake{border:1px solid var(--line);border-radius:12px;padding:13px;margin:10px 0}.time-signal{font-size:13px;color:var(--muted)}[hidden]{display:none!important}@media(max-width:550px){main{padding:22px 12px}.examples{grid-template-columns:1fr}.clock{width:220px}.prompt{font-size:20px}.panel{border-radius:17px}}
</style></head><body><main><header><p class="small">American English File 4th Edition · Level 1 · Practical English 2</p><h1>What Time Is It?</h1><p>Алина и Рома · A1 · Самостоятельная практика · 12–15 минут</p></header><div class="track" aria-hidden="true"><i id="bar"></i></div><p class="small" id="progress"></p><nav id="nav" aria-label="Этапы"></nav><section id="app" class="panel"></section><div class="actions"><button class="secondary" data-action="review">Review Mistakes</button><button class="secondary" data-action="reset">Practice Again</button></div><p class="small" id="storage">Прогресс сохраняется в этом браузере. Интернет не нужен.</p><noscript>Для тренажёра нужен JavaScript.</noscript></main>
<script>
'use strict';
const names=['Study','Read the Clock','Another Way','Complete','Ask the Time','Build the Question','Mixed Review'];
const tasks=[];
function add(stage,prompt,answer,extra={}){const task={id:'t'+tasks.length,stage,prompt,answer,...extra};tasks.push(task);return task;}
const clockRows=[
 [7,15,['seven fifty','seven fifteen','seven thirty'],'seven fifteen'],[9,30,['nine thirty','nine thirteen','ten thirty'],'nine thirty'],
 [4,45,['four fifteen','five forty-five','four forty-five'],'four forty-five'],[11,10,['eleven ten','ten eleven','eleven fifty'],'eleven ten'],
 [2,20,['two twelve','two twenty','twenty two'],'two twenty'],[6,50,['six fifteen','six fifty','seven fifty'],'six fifty'],
 [8,0,['eight thirty',"eight o’clock","seven o’clock"],'eight o’clock'],[3,35,['three thirty-five','three twenty-five','four thirty-five'],'three thirty-five']
];
clockRows.forEach(([hour,minute,options,answer])=>add(1,'Look at the clock. Choose the correct time.',answer,{type:'choice',hour,minute,options,auto:true}));
[
 ['6:15',['quarter to six','quarter after six','half past six'],'quarter after six'],
 ['8:45',['quarter after eight','quarter to nine','quarter to eight'],'quarter to nine'],
 ['10:30',['half past ten','half past eleven','quarter after ten'],'half past ten'],
 ['2:10',['ten to two','ten after two','twenty after two'],'ten after two'],
 ['5:55',['five after five','five to six','five to five'],'five to six'],
 ['11:20',['twenty after eleven','twenty to eleven','ten after eleven'],'twenty after eleven'],
 ['3:40',['twenty after three','twenty to four','twenty to three'],'twenty to four'],
 ['7:05',['five to seven','five after seven','fifteen after seven'],'five after seven']
].forEach(([digital,options,answer])=>add(2,'Choose another way to say the time.',answer,{type:'choice',digital,options}));
[
 ['It’s quarter ___ nine.','8:45',['after','to','past'],'to'],['It’s ten ___ six.','6:10',['to','after',"o’clock"],'after'],
 ['It’s half ___ four.','4:30',['past','to','after'],'past'],['It’s five ___ twelve.','11:55',['after','past','to'],'to'],
 ['It’s ___ after two.','2:15',['quarter','half','five'],'quarter'],['It’s seven ___.','7:00',['to',"o’clock",'after'],'o’clock']
].forEach(([prompt,digital,options,answer])=>add(3,prompt,answer,{type:'choice',digital,options}));
[
 ['What ___ is it? — It’s seven thirty.','time','first'],['___ the time? — It’s nine fifteen.',"What’s",'second'],
 ['What time ___ it? — It’s six o’clock.','is','first'],['What’s ___ time? — It’s quarter to eight.','the','second'],
 ['___ time is it? — It’s half past ten.','What','first'],['___ the time? — It’s eleven twenty.',"What’s",'second'],
 ['What ___ is it? — It’s five forty-five.','time','first'],['What’s the ___? — It’s eight ten.','time','second']
].forEach(([prompt,answer,form])=>add(4,prompt,answer,{type:'text',form}));
add(5,'Put the words in order.','What time is it?',{type:'order',tokens:['time','is','What','it'],form:'first',group:'Part A'});
add(5,'Put the words in order.',"What’s the time?",{type:'order',tokens:['the',"What’s",'time'],form:'second',group:'Part A'});
[
 ['Спроси «Который час?». Начни с What time…','What time is it?','first'],
 ['Спроси «Который час?». Начни с What’s…',"What’s the time?",'second'],
 ['Напиши первый вариант вопроса.','What time is it?','first'],
 ['Напиши второй вариант вопроса.',"What’s the time?",'second']
].forEach(([prompt,answer,form])=>add(5,prompt,answer,{type:'text',form,group:'Part B',hideAnswer:true}));
add(6,'Look at the clock.','nine fifteen',{type:'choice',hour:9,minute:15,options:['nine fifteen','nine fifty','ten fifteen']});
add(6,'Спроси «Который час?» через What time…','What time is it?',{type:'text',form:'first'});
add(6,'Say it another way.','quarter to seven',{type:'choice',digital:'6:45',options:['quarter to seven','quarter after six','quarter to six']});
add(6,'Спроси «Который час?» через What’s…',"What’s the time?",{type:'text',form:'second'});
add(6,'Half past four = ?','4:30',{type:'choice',options:['4:30','4:15','3:30']});
add(6,'Correct the mistake: What time it is?','What time is it?',{type:'text',form:'first'});
add(6,'Ten after eight = ?','8:10',{type:'choice',options:['8:10','7:50','8:50']});
add(6,'Correct the mistake: What’s time?',"What’s the time?",{type:'text',form:'second'});
const KEY='what-time-a1-v1';
function fresh(){return {stage:0,positions:{},answers:{},records:{},errors:{},revealed:{},order:{},mixed:[],studied:false,review:false,reviewIds:[],reviewPosition:0,finished:false};}
let state=fresh();try{state={...state,...JSON.parse(localStorage.getItem(KEY)||'{}')};}catch{}
state.stage=Math.max(0,Math.min(6,Number(state.stage)||0));
const el=id=>document.getElementById(id);
function escape(value){return String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function normalize(value){return String(value??'').toLowerCase().replace(/[’‘ʼ]/g,"'").replace(/\bwhat's\b/g,'what is').replace(/[?!.]/g,'').replace(/\s*'\s*/g,"'").replace(/\s+/g,' ').trim();}
function shuffle(values){const result=[...values];for(let i=result.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[result[i],result[j]]=[result[j],result[i]];}return result;}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));}catch{el('storage').textContent='Браузер ограничил сохранение. Прогресс доступен до закрытия страницы.';}}
function ordered(key,values){if(!state.order[key])state.order[key]=shuffle(values);return state.order[key];}
function clock(hour,minute){
 const marks=Array.from({length:60},(_,i)=>{const angle=i*Math.PI/30;const start=i%5===0?85:91;return `<line x1="${100+Math.sin(angle)*start}" y1="${100-Math.cos(angle)*start}" x2="${100+Math.sin(angle)*95}" y2="${100-Math.cos(angle)*95}" stroke="${i%5===0?'#555a79':'#bbbfd4'}" stroke-width="${i%5===0?2:1}"/>`;}).join('');
 const numbers=Array.from({length:12},(_,i)=>{const n=i+1;const angle=n*Math.PI/6;return `<text x="${100+Math.sin(angle)*73}" y="${100-Math.cos(angle)*73+5}" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#30334d">${n}</text>`;}).join('');
 const hourAngle=(hour%12)*30+minute*.5;const minuteAngle=minute*6;
 return `<svg class="clock" viewBox="0 0 200 200" role="img" aria-label="Аналоговые часы. Короткая тёмная стрелка — часовая, длинная фиолетовая — минутная."><circle cx="100" cy="100" r="98" fill="#fff" stroke="#dddced" stroke-width="3"/>${marks}${numbers}<line x1="100" y1="109" x2="100" y2="53" stroke="#30334d" stroke-width="6" stroke-linecap="round" transform="rotate(${hourAngle} 100 100)"/><line x1="100" y1="110" x2="100" y2="27" stroke="#6956d5" stroke-width="3.5" stroke-linecap="round" transform="rotate(${minuteAngle} 100 100)"/><circle cx="100" cy="100" r="5" fill="#30334d"/></svg>`;
}
function studyHTML(){
 const examples=[[7,0,"seven o’clock",'—'],[8,5,'eight oh five','five after eight'],[9,15,'nine fifteen','quarter after nine'],[10,30,'ten thirty','half past ten'],[11,45,'eleven forty-five','quarter to twelve'],[2,50,'two fifty','ten to three'],[6,3,'six oh three','three minutes after six']];
 return `<h2>Two ways to ask the time</h2><div class="rule"><div class="big">What time is it?</div><p>Который час?</p><div class="big">What’s the time?</div><p>Который час?</p><p>Оба вопроса означают одно и то же. What time is it? особенно распространён в американском английском.</p></div><h2>Two ways to tell the time</h2><div class="examples">${examples.map(([h,m,a,b])=>`<div class="example">${clock(h,m)}<p><b>${h}:${String(m).padStart(2,'0')}</b></p><p>${a}</p>${b==='—'?'':`<p>${b}</p>`}</div>`).join('')}</div><div class="rule"><b>Remember</b><p>after — минуты после часа<br>to — минуты до следующего часа<br>quarter — 15 минут<br>half past — половина после часа<br>o’clock — ровно<br>about — примерно</p><p>Nine fifteen, ten thirty, eleven forty-five — естественный способ говорить время в AmE.</p></div><button data-action="start">Start Practice</button>`;
}
function stageList(stage){if(stage===6){if(!state.mixed.length)state.mixed=shuffle(tasks.filter(t=>t.stage===6).map(t=>t.id));return state.mixed.map(id=>tasks.find(t=>t.id===id));}return tasks.filter(t=>t.stage===stage);}
function currentList(){return state.review?state.reviewIds.map(id=>tasks.find(t=>t.id===id)):stageList(state.stage);}
function currentTask(){const list=currentList();return list[state.review?state.reviewPosition:state.positions[state.stage]||0];}
function answerValue(task){const value=state.answers[task.id];return task.type==='order'&&Array.isArray(value)?value.map(i=>task.tokens[i]).join(' '):value;}
function explanation(task){
 if(task.form)return task.form==='first'?'Порядок слов: What time + is + it?':'What’s = What is. После этого нужны the time.';
 if(task.hour!==undefined)return `Короткая стрелка показывает час ${task.hour}, длинная — ${task.minute} минут. Каждый шаг между цифрами равен 5 минутам.`;
 if(task.answer.includes('to')||task.answer==='to')return 'To показывает, сколько минут осталось до следующего часа. Называем следующий час.';
 if(task.answer.includes('half')||task.answer==='past'||task.prompt.includes('Half past'))return 'Half past — 30 минут после названного часа.';
 if(task.answer.includes('quarter')||task.answer==='quarter')return 'Quarter — 15 минут. After означает после часа, to — до следующего часа.';
 if(task.answer.includes('after')||task.answer==='after'||task.prompt.includes('after'))return 'After означает минуты после названного часа.';
 return 'O’clock используем, когда минутная стрелка стоит на 12: ровно названный час.';
}
function feedback(task){
 const record=state.records[task.id];if(!record||record.last===null)return '';
 const show=record.last||!task.hideAnswer||state.revealed[task.id];
 return `<div class="feedback ${record.last?'good':'bad'}" role="status"><b>${record.last?'Correct!':'Not quite. Try again.'}</b><p>${escape(explanation(task))}</p>${show?`<p>Правильный ответ: <b>${escape(task.answer)}</b></p>`:''}${!record.last?`<div class="actions"><button class="secondary" data-action="retry">Try Again</button>${task.hideAnswer&&!state.revealed[task.id]?'<button class="secondary" data-action="show">Show Answer</button>':''}</div>`:''}</div>`;
}
function taskHTML(task){
 const value=state.answers[task.id];let controls='';
 if(task.type==='choice')controls=`<div class="options" role="group" aria-label="Варианты ответа">${ordered(task.id+'options',task.options).map(option=>`<button class="option ${value===option?'selected':''}" data-option="${escape(option)}" aria-pressed="${value===option}">${escape(option)}</button>`).join('')}</div>`;
 if(task.type==='text')controls=`<input id="answer" aria-label="Твой ответ" placeholder="Type your answer…" value="${escape(value)}" autocomplete="off" spellcheck="false">`;
 if(task.type==='order'){
  const a=Array.isArray(value)?value:[];
  controls=`<div class="sentence" aria-live="polite">${a.map((index,position)=>`<button class="word" data-remove="${position}" aria-label="Убрать ${escape(task.tokens[index])}">${escape(task.tokens[index])}</button>`).join('')}</div><div class="bank">${ordered(task.id+'tokens',task.tokens.map((_,i)=>i)).filter(i=>!a.includes(i)).map(index=>`<button class="word" data-token="${index}">${escape(task.tokens[index])}</button>`).join('')}</div>`;
 }
 return `<p class="small">${task.group?task.group+' · ':''}${state.review?'Повторение':'Question'} ${(state.review?state.reviewPosition:state.positions[state.stage]||0)+1} / ${currentList().length}</p><div class="prompt">${escape(task.prompt)}</div>${task.hour!==undefined?clock(task.hour,task.minute):''}${task.digital?`<div class="digital">${task.digital}</div>`:''}${controls}${task.auto?'':'<button data-action="check">Check</button>'}<div id="feedback">${feedback(task)}</div>`;
}
function summary(){
 const finals=tasks.filter(t=>t.stage===6);const score=finals.filter(t=>state.records[t.id]?.first).length;
 const done=tasks.filter(t=>state.records[t.id]?.last).length;
 const attempted=tasks.filter(t=>state.records[t.id]).length;
 return `<h2>What Time Is It? — ${done===tasks.length?'Completed':'Results'}</h2><div class="score">${score} / 8</div><p>Mixed Review · первая попытка<br>Верно сейчас ${finals.filter(t=>state.records[t.id]?.last).length} / 8</p><p>По всему тренажёру верно сейчас ${done} / ${tasks.length}. Проверено ${attempted}.</p><h3>You can now…</h3><ul><li>Ask the time in two ways.</li><li>Read an analog clock.</li><li>Say the time in two ways.</li><li>Use after, to, quarter, and half past.</li></ul><div class="actions"><button data-action="review">Review Mistakes</button><button class="secondary" data-action="reset">Practice Again</button></div>`;
}
function update(){
 const done=tasks.filter(t=>state.records[t.id]?.last).length;
 el('progress').textContent=`Верно ${done} из ${tasks.length} · Заданий с ошибками ${Object.keys(state.errors).length}`;
 el('bar').style.width=done/tasks.length*100+'%';
 el('nav').innerHTML=names.map((name,i)=>`<button class="secondary" data-stage="${i}" aria-current="${!state.review&&state.stage===i?'step':'false'}">${i+1}. ${name}</button>`).join('');save();
}
function render(scroll=false){
 let html;
 if(state.review){
  const task=currentTask();
  html=`<h2>Review Mistakes</h2>${task?taskHTML(task):'<p class="notice">Раунд повторения завершён. Первоначальные ошибки сохранены.</p>'}`;
 }else if(state.stage===0)html=studyHTML();
 else if(state.finished&&state.stage===6)html=summary();
 else{const task=currentTask();html=`<h2>${names[state.stage]}</h2>${task?taskHTML(task):'<p>Этап завершён.</p>'}`;}
 const task=currentTask();
 if(state.stage!==0||state.review){
  const list=currentList(),position=state.review?state.reviewPosition:state.positions[state.stage]||0;
  const checked=task&&state.records[task.id]?.last!==undefined&&state.records[task.id]?.last!==null;
  const nextDisabled=task&&!checked;
  if(task&&!(state.finished&&!state.review&&state.stage===6))html+=`<div class="actions page-actions"><button class="secondary" data-action="previous" ${position===0?'disabled':''}>Previous</button><button data-action="next" ${nextDisabled?'disabled':''}>${position===list.length-1?(state.review?'Finish Review':state.stage===6?'See Results':'Next Stage'):'Next'}</button></div>`;
 }
 el('app').innerHTML=html;update();if(scroll)el('app').scrollIntoView({block:'start'});
}
function check(){
 const task=currentTask();if(!task)return;
 const value=answerValue(task);
 if(!normalize(value)){el('feedback').innerHTML='<p class="notice" role="status">Сначала дай ответ.</p>';return;}
 const correct=normalize(value)===normalize(task.answer);const old=state.records[task.id];
 state.records[task.id]={first:old?old.first:correct,last:correct,attempts:(old?.attempts||0)+1};
 if(!correct)state.errors[task.id]=true;render();
}
function change(value){const task=currentTask();state.answers[task.id]=value;if(state.records[task.id])state.records[task.id].last=null;delete state.revealed[task.id];}
document.addEventListener('click',event=>{
 const button=event.target.closest('button');if(!button)return;const d=button.dataset;
 if(d.stage!==undefined){state.stage=Number(d.stage);state.review=false;render(true);return;}
 if(d.option){change(d.option);if(currentTask().auto)check();else render();return;}
 if(d.token!==undefined){const old=Array.isArray(state.answers[currentTask().id])?state.answers[currentTask().id]:[];change([...old,Number(d.token)]);render();return;}
 if(d.remove!==undefined){const a=[...state.answers[currentTask().id]];a.splice(Number(d.remove),1);change(a);render();return;}
 if(d.action==='check'){check();return;}
 if(d.action==='show'){state.revealed[currentTask().id]=true;render();return;}
 if(d.action==='retry'){const task=currentTask();delete state.answers[task.id];delete state.revealed[task.id];state.records[task.id].last=null;render();el('answer')?.focus();return;}
 if(d.action==='start'){state.studied=true;state.stage=1;render(true);return;}
 if(d.action==='previous'){if(state.review)state.reviewPosition--;else state.positions[state.stage]=(state.positions[state.stage]||0)-1;render();return;}
 if(d.action==='next'){
  const list=currentList();
  if(state.review){state.reviewPosition++;render(true);return;}
  const position=state.positions[state.stage]||0;
  if(position<list.length-1)state.positions[state.stage]=position+1;
  else if(state.stage===6)state.finished=true;
  else state.stage++;
  render(true);return;
 }
 if(d.action==='review'){
  state.reviewIds=shuffle(Object.keys(state.errors));state.reviewPosition=0;state.review=true;
  for(const id of state.reviewIds){delete state.answers[id];delete state.revealed[id];state.records[id].last=null;}
  render(true);return;
 }
 if(d.action==='reset'&&confirm('Начать тренажёр заново? Ответы и прогресс будут сброшены.')){state=fresh();render(true);}
});
document.addEventListener('input',event=>{if(event.target.id==='answer'){change(event.target.value);el('feedback').innerHTML='';const next=document.querySelector('[data-action="next"]');if(next)next.disabled=true;update();}});
document.addEventListener('keydown',event=>{if(event.key==='Enter'&&event.target.id==='answer')check();});
render();
</script></body></html>
