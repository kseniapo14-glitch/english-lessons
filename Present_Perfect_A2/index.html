function normalize(text){
  return text.toLowerCase().replace(/[’‘]/g,"'").replace(/\b(haven|hasn)'t\b/g,(_,v)=>v.slice(0,-1)+" not")
    .replace(/\b(i|you|we|they|who)'ve\b/g,"$1 have").replace(/\b(he|she|it|someone|who)'s\b/g,"$1 has")
    .replace(/\bwhere's\b/g,"where is").replace(/\btraveled\b/g,"travelled")
    .replace(/[“”".,!?:;]/g," ").trim().replace(/\s+/g," ");
}
function canonical(value,q){
  let out=normalize(value);
  if(q.translation||q.answer.includes("already")){
    // Affirmative already can follow the auxiliary or the rest of the clause.
    out=out.replace(/^(i have|she has) already (.+)$/,"$1 $2 already");
  }
  if(q.translation){
    out=out.replace(/\bthis (movie|film)\b/g,"this film").replace(/\bthe (store|shop)\b/g,"the shop")
      .replace(/\b(taken|flown) a plane\b/g,"travelled by plane");
  }
  return out;
}

}
function button(txt,fn,attr={}){
  const b=node("button",txt,{type:"button",...attr});
  b.addEventListener("click",fn);
  return b;
}
function shuffled(items,seed){
  const copy=[...items];
  for(let i=copy.length-1;i>0;i--){
    seed=(Math.imul(seed,1664525)+1013904223)>>>0;
    const j=seed%(i+1);
    [copy[i],copy[j]]=[copy[j],copy[i]];
  }
  return copy;
}
function seedFor(q){
  return q.id.split("-").reduce((sum,n)=>sum*173+Number(n)+13,0);
}
let reviewOrder=[];
function buildProgress(){
  const completed=tasks.filter((items,i)=>{
    if([1,5,8].includes(i))return state.spoken[i];
    if(i===11)return state.reviewDone && !tasks.flat().some(q=>entry(q).missed);
    return items.length && items.every(q=>["correct","accepted","incorrect","uncertain"].includes(entry(q).status));
  }).length;
  $("progress").value=completed;
  $("progressLabel").textContent="Завершено "+completed+" из 13 заданий";
  $("taskLabel").textContent="Task "+(state.task+1)+" / 13";
}
function check(q){
  const e=entry(q);
  if(!e.value.trim())return false;
  const ok=matches(e.value,q);
  e.status=ok?"correct":q.translation?"uncertain":"incorrect";
  e.missed=!ok;
  if(!ok)state.reviewDone=false;
  save();
  buildProgress();
  return true;
}
function feedback(q){
  const e=entry(q);
  if(!e.status)return "";
  if(e.status==="correct"||e.status==="accepted")return "Верно. "+q.explanation;
  if(e.status==="uncertain")return "Ответ отличается от образца. Сверь его с преподавателем. Образец: "+q.answer+" "+q.explanation;
  return (e.status==="shown"?"Образец: ":"Попробуй ещё раз. Ответ: ")+q.answer+" "+q.explanation;
}
function renderQuestion(parent,q,opts={}){
  const e=entry(q);
  const card=node("section",undefined,{class:"card"});
  card.append(node("p",q.prompt,{class:"question",id:"prompt-"+q.id}));
  if(q.tiles)card.append(node("p","Нажимай на блоки в нужном порядке.",{class:"small"}));
  const controls=node("div",undefined,{class:q.options?"choices":"editor"});
  const actions=node("div",undefined,{class:"actions"});
  const note=node("p",undefined,{class:"feedback",role:"status"});
  const hint=node("p",undefined,{class:"small"});
  let built=e.tiles??[];
  function updateNote(){
    note.textContent=feedback(q);
    note.hidden=!note.textContent;
    note.classList.toggle("retry",!["correct","accepted"].includes(e.status));
    if(accept)accept.hidden=e.status!=="uncertain";
    if(mark)mark.hidden=e.status!=="uncertain";
  }
  function edit(value){
    e.value=value;
    e.status="";
    if(opts.quiz)state.quizChecked=false;
    save();
    updateNote();
    buildProgress();
  }
  function verify(){
    if(!check(q)){
      note.textContent="Введи или выбери ответ.";
      note.hidden=false;
      note.classList.add("retry");
      return;
    }
    hint.hidden=true;
    updateNote();
  }
  if(q.options){
    for(const choice of shuffled(q.options,seedFor(q))){
      controls.append(button(choice,()=>{
        edit(choice);
        for(const b of controls.children)b.setAttribute("aria-pressed",String(b.textContent===choice));
        if(!opts.quiz)verify();
      },{"aria-pressed":String(e.value===choice),lang:"en"}));
    }
  }else if(q.tiles){
    const keys=shuffled(q.tiles.map((_,i)=>i),seedFor(q));
    const line=node("div",undefined,{class:"tiles built","aria-label":"Собранное предложение"});
    const bank=node("div",undefined,{class:"tiles","aria-label":"Доступные блоки"});
    function refreshTiles(){
      line.replaceChildren(...built.map((idx,i)=>button(q.tiles[idx],()=>{
        built.splice(i,1);
        changeTiles();
      })));
      bank.replaceChildren(...keys.map(idx=>{
        const b=button(q.tiles[idx],()=>{built.push(idx);changeTiles()});
        b.disabled=built.includes(idx);
        return b;
      }));
    }
    function changeTiles(){
      e.tiles=built;
      edit(built.map(i=>q.tiles[i]).join(" ").replace(" ?","?"));
      refreshTiles();
      const available=bank.querySelector("button:not(:disabled)");
      (available??line.firstElementChild)?.focus();
    }
    refreshTiles();
    controls.append(line,bank);
  }else{
    const field=node("input",undefined,{type:"text","aria-labelledby":"prompt-"+q.id,autocomplete:"off",spellcheck:"false",lang:"en",placeholder:"Type your answer"});
    field.value=e.value;
    field.addEventListener("input",()=>edit(field.value));
    field.addEventListener("keydown",ev=>{if(ev.key==="Enter")verify()});
    controls.append(field);
  }
  if(!opts.quiz&&!q.options)actions.append(button("Check",verify,{class:"primary"}));
  if(q.translation&&!opts.review){
    actions.append(button("Hint",()=>{hint.textContent=q.explanation;hint.hidden=false}));
    actions.append(button("Show answer",()=>{
      if(e.status==="correct"||e.status==="accepted"){updateNote();return}
      e.status="shown";
      e.missed=true;
      state.reviewDone=false;
      save();buildProgress();updateNote();
    }));
  }
  hint.hidden=true;
  const accept=q.translation?button("Засчитать с преподавателем",()=>{
    e.status="accepted";e.missed=false;save();buildProgress();updateNote();
  }):null;
  const mark=q.translation?button("Отметить ошибку",()=>{
    e.status="incorrect";e.missed=true;state.reviewDone=false;save();buildProgress();updateNote();
  }):null;
  if(accept)actions.append(accept,mark);
  card.append(controls,actions,hint,note);
  parent.append(card);
  updateNote();
}
function details(label,content){
  const d=node("details");
  d.append(node("summary",label),node("p",content,{lang:"en"}));
  return d;
}
const photoCards=[
  ["The laptop doesn't work.","На клавиатуре разлит кофе.","Someone has spilled coffee on it."],
  ["She can't open the door.","Она ищет ключи в сумке.","She's lost her keys."],
  ["The plate is empty.","На тарелке остались только крошки.","Someone has eaten the food."],
  ["There's glass on the floor.","В комнате разбито окно.","Someone has broken the window."]
];
function photoSpeaking(main){
  const grid=node("div",undefined,{class:"grid"});
  photoCards.forEach(([p,alt,a],i)=>{
    const card=node("section",undefined,{class:"card"});
    const img=node("img",undefined,{class:"photo",src:source.photos[i],alt,referrerpolicy:"no-referrer"});
    const fallback=node("p",alt,{class:"rules"});
    fallback.hidden=true;
    img.addEventListener("error",()=>{img.hidden=true;fallback.hidden=false});
    card.append(img,fallback,node("h3",p,{lang:"en"}),details("Show possible answer",a));
    grid.append(card);
  });
  main.append(grid);
}
const checklists=[
  ["Airport Checklist",["Buy tickets","Pack bags","Call a taxi","Find passports","Check flight details","Have breakfast"],[0,0,1,2,1,2]],
  ["Party Checklist",["Buy food","Invite friends","Clean the apartment","Choose music","Make a cake","Decorate the room"],[0,0,1,2,1,0]]
];
function table(headers,rows){
  const wrap=node("div",undefined,{class:"scroll"});
  const t=node("table");
  const head=t.createTHead().insertRow();
  headers.forEach(h=>head.append(node("th",h,{scope:"col"})));
  const body=t.createTBody();
  rows.forEach(row=>row.forEach((value,i)=>{
    const tr=i===0?body.insertRow():body.rows[body.rows.length-1];
    tr.append(node("td",value));
  }));
  wrap.append(t);
  return wrap;
}
function toggle(group,labels,change){
  const bar=node("div",undefined,{class:"actions","aria-label":group});
  labels.forEach((label,i)=>bar.append(button(label,()=>{
    Array.from(bar.children).forEach((b,j)=>b.setAttribute("aria-pressed",String(i===j)));
    change(i);
  },{"aria-pressed":String(i===0)})));
  return bar;
}
function airport(main){
  const area=node("div",undefined,{class:"card"});
  const content=node("div");
  let round=0;
  let role=0;
  function paint(){
    const [title,jobs,status]=checklists[round];
    const rows=jobs.map((job,i)=>role?[job,["Already done","Not yet","Just done"][status[i]]]:[job]);
    content.replaceChildren(node("h3",title),table(role?["Action","Status"]:["Action"],rows));
  }
  area.append(toggle("Список",["Airport","Party"],i=>{round=i;paint()}),
    node("p","Student A задаёт вопросы. Student B смотрит статусы и отвечает. Показывайте каждому игроку только его экран."),
    toggle("Роль",["Student A","Student B"],i=>{role=i;paint()}),content,
    details("Show example","A: Have you packed the bags yet? B: Yes, I've already packed them. A: Have you called a taxi yet? B: No, I haven't called one yet."));
  main.append(area);
  paint();
}
function mystery(main){
  const names=["Alex","Mia","Ben"];
  const experiences=["Been to Japan","Ridden a horse","Played golf","Travelled by plane"];
  const profiles=[[true,false,true,true],[false,true,false,true],[true,true,false,false]];
  const area=node("div",undefined,{class:"card"});
  const content=node("div");
  let person=0;
  let teacher=false;
  let revealed=false;
  function paint(){
    content.replaceChildren();
    if(teacher){
      content.append(node("p","Выбери персонажа. Отвечай по карточке и держи её закрытой от студента."));
      const select=node("select",undefined,{"aria-label":"Персонаж"});
      names.forEach((name,i)=>select.append(node("option",name,{value:i})));
      select.value=person;
      select.addEventListener("change",()=>{
        person=Number(select.value);revealed=false;paint();content.querySelector("select").focus();
      });
      content.append(select,table(["Experience",names[person]],experiences.map((p,i)=>[p,profiles[person][i]?"Yes, I have.":"No, I haven't."])));
      return;
    }
    content.append(node("p","Задай вопросы о четырёх ситуациях. Затем назови персонажа и составь два предложения о его опыте."));
    content.append(table(["Experience"],experiences.map(x=>[x])));
    content.append(details("Show sample questions","Have you ever been to Japan? Have you ever ridden a horse? Have you ever played golf? Have you ever travelled by plane?"));
    if(revealed){
      content.append(node("h3","Mystery person: "+names[person]));
      content.append(table(["Experience",...names],experiences.map((p,i)=>[p,...profiles.map(profile=>profile[i]?"Yes":"No")])));
    }else{
      content.append(button("Reveal after guessing",()=>{revealed=true;paint();content.querySelector("h3").setAttribute("tabindex","-1");content.querySelector("h3").focus()}));
    }
  }
  area.append(toggle("Роль",["Student","Teacher"],i=>{teacher=Boolean(i);paint()}),content);
  main.append(area);paint();
}
function spokenDone(main,i){
  const bar=node("div",undefined,{class:"actions"});
  const b=button(state.spoken[i]?"Выполнено":"Отметить как выполненное",()=>{
    state.spoken[i]=!state.spoken[i];save();buildProgress();
    b.textContent=state.spoken[i]?"Выполнено":"Отметить как выполненное";
    b.setAttribute("aria-pressed",String(Boolean(state.spoken[i])));
  },{"aria-pressed":String(Boolean(state.spoken[i]))});
  bar.style.marginTop="16px";
  bar.append(b);main.append(bar);
}
function storyTask(main){
  const block=node("section",undefined,{class:"card"});
  block.append(node("h3","A Busy Monday"));
  const passage=node("p",undefined,{class:"passage",lang:"en"});
  const results=node("div",undefined,{class:"status",role:"status"});
  const parts=story.split(/\[(\d+)\]/);
  const selects=[];
  parts.forEach((part,i)=>{
    if(i%2===0){passage.append(document.createTextNode(part));return}
    const q=tasks[9][Number(part)-1];
    const e=entry(q);
    const label=node("label",part+". ");
    const s=node("select",undefined,{"aria-label":"Пропуск "+part});
    s.append(node("option","Choose…",{value:""}));
    shuffled(q.options,seedFor(q)).forEach(o=>s.append(node("option",o,{value:o})));
    s.value=e.value;
    s.addEventListener("change",()=>{e.value=s.value;e.status="";save();buildProgress();report()});
    selects.push(s);label.append(s);passage.append(label);
  });
  function report(showMissing=false){
    results.replaceChildren();
    tasks[9].forEach((q,i)=>{
      const message=feedback(q);
      if(message)results.append(node("p",(i+1)+". "+message,{class:"feedback"+(entry(q).status==="correct"?"":" retry")}));
    });
    if(showMissing)results.append(node("p","Выбери ответ для каждого пропуска, который хочешь проверить."));
  }
  block.append(passage,button("Check answers",()=>{
    const missing=tasks[9].map(check).includes(false);
    report(missing);
  },{class:"primary"}),results);
  main.append(block);report();
}
function stats(){
  return table(["Раздел","Верно / проверено","Точность"],[16,17,18].map(unit=>{
    const marked=tasks.flat().filter(q=>q.unit===unit&&["correct","accepted","incorrect"].includes(entry(q).status));
    const right=marked.filter(q=>["correct","accepted"].includes(entry(q).status)).length;
    return ["Unit "+unit,right+" / "+marked.length,marked.length?Math.round(right/marked.length*100)+"%":"—"];
  }));
}
function review(main){
  const section=node("section",undefined,{class:"card"});
  const total=tasks.flat().filter(q=>entry(q).missed).length;
  section.append(stats(),node("p",total?"На повторение: "+total+".":"Сейчас нет вопросов на повторение."));
  if(total){
    section.append(button("Начать повторение",()=>{
      reviewOrder=tasks.flat().filter(q=>entry(q).missed);
      reviewOrder.forEach(q=>{
        const e=entry(q);
        e.value="";e.tiles=[];e.status="";
      });
      save();render(true);
    },{class:"primary"}));
    if(reviewOrder.length)section.lastElementChild.hidden=true;
  }else{
    section.append(button(state.reviewDone?"Перейти к Final Quiz":"Завершить Review",()=>{
      state.reviewDone=true;save();go(12);
    },{class:"primary"}));
  }
  main.append(section);
  const active=reviewOrder.filter(q=>q);
  for(const q of active)renderQuestion(main,q,{review:true});
  if(active.length)main.append(button("Обновить результаты",()=>{
    reviewOrder=[];
    if(!tasks.flat().some(q=>entry(q).missed))state.reviewDone=true;
    save();render(true);
  },{class:"primary"}));
}
function quiz(main){
  tasks[12].forEach(q=>renderQuestion(main,q,{quiz:true}));
  const result=node("p",undefined,{class:"status",role:"status"});
  function summary(){
    const right=tasks[12].filter(q=>entry(q).status==="correct").length;
    result.textContent=state.quizChecked?"Final Quiz: "+right+" / 10.": "Ответь на все вопросы и нажми Check my answers.";
  }
  main.append(button("Check my answers",()=>{
    if(tasks[12].some(q=>!entry(q).value)){
      result.textContent="Сначала ответь на все 10 вопросов.";
      return;
    }
    tasks[12].forEach(check);
    state.quizChecked=true;save();render();
    const report=$("main").querySelector("[data-quiz-result]");
    report?.focus();
  },{class:"primary"}),result);
  result.setAttribute("data-quiz-result","");
  result.tabIndex=-1;
  main.addEventListener("click",ev=>{if(ev.target.matches(".choices button"))summary()},{once:false,signal:renderScope.signal});
  summary();
  if(state.quizChecked){
    main.append(stats());
    if(tasks.flat().some(q=>entry(q).missed))main.append(button("Review mistakes",()=>go(11)));
  }
}
let renderScope;
function render(focus=false){
  renderScope?.abort();
  renderScope=new AbortController();
  const i=state.task;
  const main=$("main");
  const title=node("h2","Task "+(i+1)+" – "+titles[i],{tabindex:"-1",lang:"en"});
  main.replaceChildren(title,node("p",directions[i],{class:"context"}));
  $("nav").replaceChildren(...titles.map((t,j)=>button(String(j+1),()=>go(j),{
    "aria-label":"Task "+(j+1)+" – "+t,...(i===j?{"aria-current":"step"}:{})
  })));
  $("back").disabled=i===0;
  $("next").disabled=i===12;
  if(rules[i])main.append(node("p",rules[i],{class:"rules"}));
  if(i===1){photoSpeaking(main);spokenDone(main,i)}
  else if(i===5){airport(main);spokenDone(main,i)}
  else if(i===8){mystery(main);spokenDone(main,i)}
  else if(i===9)storyTask(main);
  else if(i===11)review(main);
  else if(i===12)quiz(main);
  else{
    const sections={
      2:{0:"Part A – Put the words in order",6:"Part B – Choose the past participle"},
      3:{0:"Part A – Choose just, already or yet",8:"Part B – Put the word in the correct position"},
      6:{0:"Part A – Choose ever or never",6:"Part B – Build the questions",10:"Part C – Complete the short answers"}
    };
    tasks[i].forEach((q,j)=>{
      const sub=sections[i]?.[j];
      if(sub)main.append(node("h3",sub,{lang:"en"}));
      renderQuestion(main,q);
    });
  }
  buildProgress();
  if(focus){title.focus({preventScroll:true});window.scrollTo(0,0)}
}
function go(task){
  if(!titles[task])return;
  if(task!==11)reviewOrder=[];
  state.task=task;save();render(true);
}
$("back").addEventListener("click",()=>go(state.task-1));
$("next").addEventListener("click",()=>go(state.task+1));
$("reset").addEventListener("click",()=>{
  if(!window.confirm("Начать сначала? Сохранённый прогресс будет удалён."))return;
  state=initial();reviewOrder=[];save();render(true);
});
render();
</script>
