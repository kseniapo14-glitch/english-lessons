<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Everyday English · A1</title>
<style>
:root{--page:#f5f5fd;--paper:#fff;--ink:#292a43;--muted:#686e86;--purple:#6955d3;--line:#dedff0;--soft:#f1eeff;--blue:#edf5ff}*{box-sizing:border-box}body{margin:0;background:var(--page);color:var(--ink);font:17px/1.6 Arial,sans-serif}main{max-width:950px;margin:auto;padding:36px 22px 60px}header p{color:var(--muted);margin:8px 0}h1{font-size:clamp(34px,6vw,52px);margin:10px 0;line-height:1.1}h2{font-size:27px;line-height:1.3;margin:0 0 18px}h3{font-size:19px;line-height:1.45}button{font:inherit;font-weight:650;border:1px solid transparent;border-radius:12px;padding:11px 16px;cursor:pointer;background:var(--purple);color:#fff}button:disabled{opacity:.5;cursor:default}button:hover{filter:brightness(.96)}button.secondary{background:var(--soft);color:#4f3daa;border-color:var(--line)}:focus-visible{outline:3px solid #a08ee3;outline-offset:3px}.small{font-size:14px;color:var(--muted)}.track{height:9px;background:#e1e2ee;border-radius:20px;overflow:hidden;margin:20px 0 7px}.track i{height:100%;display:block;background:var(--purple);width:0}nav{display:flex;flex-wrap:wrap;gap:7px;margin:20px 0}nav button{font-size:14px;padding:8px 11px}nav button[aria-current=step]{background:var(--purple);color:white}.panel{background:var(--paper);border:1px solid var(--line);border-radius:23px;padding:clamp(19px,4vw,35px)}.actions{display:flex;flex-wrap:wrap;gap:10px;margin:20px 0}.page-actions{justify-content:space-between}.note,.mission{padding:16px 19px;border-radius:14px;background:var(--blue);margin:18px 0}.mission{background:var(--soft)}.mission p{margin:7px 0}.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin:15px 0 25px}.phrase{background:#fbfbfe;color:var(--ink);border:1px solid var(--line);text-align:left;padding:18px}.phrase.opened{background:var(--soft);border-color:#c4b9ec}.phrase strong,.phrase span,.phrase small{display:block}.phrase span{margin:10px 0;font-size:16px;font-weight:500}.phrase small{font-size:14px;font-weight:400;color:var(--muted)}.choices{display:grid;gap:10px;margin:18px 0}.choice{background:#fafaff;color:var(--ink);border-color:var(--line);text-align:left;font-weight:500}.choice.selected{background:var(--soft);border-color:var(--purple);box-shadow:0 0 0 1px var(--purple)}.question{margin:20px 0}.feedback{border-radius:12px;padding:14px 17px;margin:18px 0}.feedback p{margin:8px 0}.feedback.good{background:#e7f4ec;color:#24503b}.feedback.bad{background:#fff0ec;color:#793f34}.feedback button{font-size:14px}.sentence{min-height:65px;background:var(--soft);border:1px dashed #c4b9e5;border-radius:13px;padding:13px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}.tiles,.bank{display:flex;flex-wrap:wrap;gap:8px;margin:15px 0}.tile{background:white;color:var(--ink);border-color:#cac4e3;font-weight:500}.tile.used{background:#e2ddf7}.wrong-word{background:#ffdad3;text-decoration:underline}.chat{margin:22px 0}.bubble{padding:14px 18px;max-width:85%;border-radius:15px;margin:12px 0}.bubble small{display:block;font-size:13px;font-weight:bold;color:var(--muted);margin-bottom:4px}.bubble.barista{background:var(--blue);border-bottom-left-radius:4px}.bubble.customer{background:var(--soft);margin-left:auto;border-bottom-right-radius:4px}details{border:1px solid var(--line);padding:13px 16px;border-radius:13px;margin:18px 0}summary{cursor:pointer;font-weight:650}table{width:100%;border-collapse:collapse;margin-top:12px}td{padding:9px 3px;border-bottom:1px solid var(--line);font-size:15px}td:last-child{text-align:right;white-space:nowrap}.receipt{background:#fff;border:1px solid #ddddeb;max-width:440px;margin:24px auto;padding:27px;box-shadow:0 5px 20px #2720410d}.receipt-title{font-size:23px;font-weight:bold;letter-spacing:2px}.receipt-row{display:flex;justify-content:space-between;gap:15px;padding:10px 0;font-size:16px}.receipt .total{border-top:1px dashed #b8b8c9;margin-top:12px;padding-top:18px}.receipt p{color:var(--muted)}.dialogue{background:#fafaff;border:1px solid var(--line);border-radius:14px;padding:18px}.dialogue p{line-height:2.1}.blank{color:#49359f;background:var(--soft);border:1px dashed #aca0d5;padding:6px 9px;margin:3px;font-size:15px;font-weight:500}.blank.target{outline:2px solid var(--purple);outline-offset:1px}.blank.correct{background:#e7f4ec;border-color:#9dc3ac}.score{font-size:57px;font-weight:750;line-height:1.2;margin:20px 0}.bank{padding:14px;background:var(--blue);border-radius:13px}[hidden]{display:none!important}@media(max-width:600px){main{padding:23px 12px 40px}.panel{border-radius:17px}.cards{grid-template-columns:1fr}.bubble{max-width:95%}nav{gap:5px}nav button{padding:7px 9px}.receipt{padding:20px}.dialogue{padding:12px}.blank{font-size:14px}}

.flip-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin:20px 0 26px}.flip-card{background:transparent;color:var(--ink);border:0;padding:0;height:220px;perspective:1000px;text-align:left}.flip-inner{display:block;position:relative;width:100%;height:100%;transition:transform .35s;transform-style:preserve-3d}.flipped .flip-inner{transform:rotateY(180deg)}.face{position:absolute;inset:0;border:1px solid var(--line);border-radius:15px;padding:22px;backface-visibility:hidden;display:flex;flex-direction:column;justify-content:center;overflow:auto}.face.front{background:var(--blue);font-size:23px}.face.back{background:var(--soft);transform:rotateY(180deg);font-weight:500}.face small{display:block;margin-top:15px;font-size:14px;color:var(--muted)}.mini-dialogue{background:#ffffffb3;padding:12px;border-radius:10px}.mini-dialogue p{margin:4px 0}.social-prompt{background:var(--blue);border-radius:15px;padding:24px;font-size:clamp(22px,4vw,29px);font-weight:650;margin:20px 0}.dialogue-section{border:1px solid var(--line);padding:20px;border-radius:16px;margin:22px 0}.dialogue-section>button{margin-top:15px}@media(max-width:600px){.flip-grid{grid-template-columns:1fr}.flip-card{height:220px}.dialogue-section{padding:13px}}@media(prefers-reduced-motion:reduce){.flip-inner{transition:none}}
</style></head><body><main><header><p class="small">American English File · Practical English · A1</p><h1>Everyday English</h1><p>Самостоятельная практика · 6–8 минут · 4 этапа</p></header><div class="track" aria-hidden="true"><i id="bar"></i></div><p class="small" id="progress"></p><nav id="nav" aria-label="Этапы"></nav><section class="panel" id="app"></section><div class="actions"><button class="secondary" data-action="review">Review Mistakes</button><button class="secondary" data-action="reset">Practice Again</button></div><p class="small" id="storage">Прогресс сохраняется в этом браузере. Интернет не нужен.</p><noscript>Для тренажёра нужен JavaScript.</noscript></main><script>'use strict';
const stageNames=['Study the Expressions','Choose the Best Response','Complete the Dialogue','Quick Review'];
const expressions=[
 ["How’s the job?","Как работа?","— How’s the job? — Good, thanks!"],
 ["Good! It’s long hours, but I like it.","Хорошо! Рабочий день длинный, но мне нравится.","— How’s the job? — Good! It’s long hours, but I like it."],
 ["Are you two friends?","Вы двое друзья?","— Are you two friends? — Yes, we are."],
 ["I come here a lot.","Я часто сюда прихожу.","— Do you come here often? — Yes, I come here a lot."],
 ["I live very near here.","Я живу совсем рядом.","— I live very near here. — Really?"],
 ["Really?","Правда?","— I live very near here. — Really?"],
 ["Do you want to go out sometime?","Не хочешь как-нибудь куда-нибудь сходить?","— Do you want to go out sometime? — Yes, I’d love to."],
 ["Me? Yes!","Я? Да!","— Do you want to go out sometime? — Me? Yes!"],
 ["Your usual?","Тебе как обычно?","— Your usual? — Yes, please."]
];
const situations=[
 ["How’s the job?",["Good, thanks!","At seven.","A latte, please."],"Good, thanks!","Вопрос о работе. Good, thanks! — Хорошо, спасибо!"],
 ["Do you want to go out sometime?",["Yes, I’d love to.","It’s £4.","I’m from Russia."],"Yes, I’d love to.","Это приглашение. Yes, I’d love to — с удовольствием."],
 ["I live very near here.",["Really?","Large, please.","Half past six."],"Really?","Собеседник сообщает, что живёт рядом. Really? показывает интерес и удивление."],
 ["Are you two friends?",["Yes, we are.","To go, please.","I’m twenty-five."],"Yes, we are.","Are you…? — Yes, we are. Здесь речь о двух друзьях."],
 ["Your usual?",["Yes, please.","At nine.","I’m tired."],"Yes, please.","Your usual? — Тебе как обычно? Yes, please — да, пожалуйста."],
 ["I come here a lot.",["Oh, nice!","Double, please.","It’s six thirty."],"Oh, nice!","Oh, nice! — дружелюбная реакция на сообщение, что собеседник часто сюда приходит."]
];
const tasks=[];
function add(stage,prompt,options,answer,explanation,extra={}){const task={id:'q'+tasks.length,stage,prompt,options,answer,explanation,...extra};tasks.push(task);return task;}
situations.forEach(([p,o,a,e])=>add(1,p,o,a,e));
const dialogueA=[
 ['Good, thanks','Ответ на вопрос о работе.'],
 ['Yes, I come here a lot','Often и a lot здесь означают «часто».'],
 ['Really','Really? — заинтересованная реакция на новую информацию.']
];
const dialogueB=[
 ['Yes, I’d love to','Вежливое согласие на приглашение.'],
 ['Sounds good','Sounds good — звучит хорошо, подходит. Здесь соглашаемся на субботу.'],
 ['See you','See you — до встречи.']
];
[dialogueA,dialogueB].forEach((rows,index)=>rows.forEach(([answer,explanation],blank)=>add(2,'Dialogue '+(index?'B':'A')+' · Пропуск '+(blank+1),rows.map(row=>row[0]),answer,explanation,{dialogue:index,blank})));
situations.forEach(([p,o,a,e])=>add(3,p,o,a,e));
const reviewContexts=[
 'A: Hey! How’s the job?\nB: ___.',
 'A: Do you come here often?\nB: ___. I live very near here.',
 'A: I live very near here.\nB: ___?\nA: Yes, just five minutes away.',
 'A: Do you want to go out sometime?\nB: ___!',
 'A: Great! How about Saturday?\nB: ___.',
 'A: See you then!\nB: ___!'
];
tasks.filter(task=>task.stage===2).forEach((task,index)=>task.prompt=reviewContexts[index]);
const KEY='everyday-english-a1-v1';
function fresh(){return {stage:0,positions:{},cards:{},seen:{},answers:{},records:{},mistakes:{},orders:{},finalOrder:[],targets:[0,0],finished:false,review:false,reviewIds:[],reviewPosition:0};}
let state=fresh();try{state={...state,...JSON.parse(localStorage.getItem(KEY)||'{}')};}catch{}
state.stage=Math.max(0,Math.min(3,+state.stage||0));
const el=id=>document.getElementById(id);
function escape(value){return String(value??'').replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));}
function shuffle(values){const result=[...values];for(let i=result.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[result[i],result[j]]=[result[j],result[i]];}return result;}
function order(key,values){if(!state.orders[key])state.orders[key]=shuffle(values);return state.orders[key];}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(state));}catch{el('storage').textContent='Сохранение ограничено браузером. Прогресс доступен до закрытия страницы.';}}
function list(){if(state.review)return state.reviewIds.map(id=>tasks.find(t=>t.id===id));if(state.stage===3){if(!state.finalOrder.length)state.finalOrder=shuffle(tasks.filter(t=>t.stage===3).map(t=>t.id));return state.finalOrder.map(id=>tasks.find(t=>t.id===id));}return tasks.filter(t=>t.stage===state.stage);}
function position(){return state.review?state.reviewPosition:state.positions[state.stage]||0;}
function current(){return list()[position()];}
function checked(task){return state.records[task.id]?.last!==null&&!!state.records[task.id];}
function record(task){const value=state.answers[task.id];if(!value)return false;const correct=value===task.answer;const old=state.records[task.id];state.records[task.id]={first:old?old.first:correct,last:correct,attempts:(old?.attempts||0)+1};if(!correct)state.mistakes[task.id]=true;return true;}
function clear(task){delete state.answers[task.id];if(state.records[task.id])state.records[task.id].last=null;}
function feedback(task){const result=state.records[task.id];if(!result||result.last===null)return '';const dialogue=task.stage===1&&result.last?`<div class="mini-dialogue"><p><b>A</b> ${escape(task.prompt)}</p><p><b>B</b> ${escape(task.answer)}</p></div>`:'';return `<div class="feedback ${result.last?'good':'bad'}" role="status"><b>${result.last?'Correct!':'Not quite. Try again.'}</b>${!result.last?`<p>Подходящий ответ: <b>${escape(task.answer)}</b></p>`:''}<p>${escape(task.explanation)}</p>${dialogue}${!result.last?`<button class="secondary" data-retry="${task.id}">Try Again</button>`:''}</div>`;}
function cardsHTML(){return `<h2>Study the Expressions</h2><p>Нажми на карточку, чтобы увидеть перевод и мини-пример. Повторное нажатие возвращает фразу.</p><div class="flip-grid">${expressions.map(([expression,translation,example],i)=>`<button class="flip-card ${state.cards[i]?'flipped':''}" data-card="${i}" aria-expanded="${!!state.cards[i]}" aria-label="${escape(expression)}"><span class="flip-inner"><span class="face front"><strong>${escape(expression)}</strong></span><span class="face back"><span>${escape(translation)}</span><small>${escape(example)}</small></span></span></button>`).join('')}</div><button data-action="start">Start Practice</button>`;}
function question(task){return `<p class="small">${state.review?'Повторение':'Question'} ${position()+1} / ${list().length}</p><div class="social-prompt">${escape(task.prompt)}</div><div class="choices">${order(task.id,task.options).map(option=>`<button class="choice ${state.answers[task.id]===option?'selected':''}" data-option="${escape(option)}" aria-pressed="${state.answers[task.id]===option}">${escape(option)}</button>`).join('')}</div><div id="feedback">${feedback(task)}</div><div class="actions page-actions"><button class="secondary" data-action="previous" ${position()?'':'disabled'}>Previous</button><button data-action="next" ${checked(task)?'':'disabled'}>${position()===list().length-1?(state.review?'Finish Review':state.stage===3?'See Results':'Next Stage'):'Next'}</button></div>`;}
function bankDialogue(index){const rows=tasks.filter(t=>t.stage===2&&t.dialogue===index);const target=state.targets[index];function blank(i){const task=rows[i];return `<button class="blank ${target===i?'target':''} ${state.records[task.id]?.last?'correct':''}" data-target="${index}:${i}" aria-label="Dialogue ${index?'B':'A'}, пропуск ${i+1}">${i+1}. ${escape(state.answers[task.id]||'Choose a phrase')}</button>`;}
 const body=index?`<p><b>A:</b> Do you want to go out sometime?</p><p><b>B:</b> ${blank(0)}!</p><p><b>A:</b> Great! How about Saturday?</p><p><b>B:</b> ${blank(1)}.</p><p><b>A:</b> See you then!</p><p><b>B:</b> ${blank(2)}!</p>`:`<p><b>A:</b> Hey! How’s the job?</p><p><b>B:</b> ${blank(0)}.</p><p><b>A:</b> Do you come here often?</p><p><b>B:</b> ${blank(1)}. I live very near here.</p><p><b>A:</b> ${blank(2)}?</p><p><b>B:</b> Yes, just five minutes away.</p>`;
 return `<section class="dialogue-section"><h3>Dialogue ${index?'B · Making plans':'A · At the coffee shop'}</h3>${index?'<p class="small">Этот диалог расширяет материал урока и помогает перенести приглашение в реальное общение.</p>':''}<div class="bank">${order('bank'+index,rows.map(t=>t.answer)).map(phrase=>{const used=rows.findIndex(t=>state.answers[t.id]===phrase);return `<button class="tile" data-bank="${index}" data-value="${escape(phrase)}" ${used>=0&&used!==target?'disabled':''}>${escape(phrase)}</button>`;}).join('')}</div><div class="dialogue">${body}</div><button data-check-dialogue="${index}">Check Dialogue</button><div id="dialogue-feedback-${index}">${rows.filter(t=>state.records[t.id]?.last===false).map(t=>`<h3>Пропуск ${t.blank+1}</h3>${feedback(t)}`).join('')}${rows.every(t=>state.records[t.id]?.last)?'<p class="feedback good">Correct! Диалог собран верно.</p>':''}</div></section>`;
}
function resultHTML(){const final=tasks.filter(t=>t.stage===3);const initial=final.filter(t=>state.records[t.id]?.first).length;const now=tasks.filter(t=>state.records[t.id]?.last).length;return `<h2>Everyday English — ${now===tasks.length?'Completed':'Your Results'}</h2><div class="score">${initial} / 6</div><p>Quick Review · первая проверка<br>Верно сейчас ${final.filter(t=>state.records[t.id]?.last).length} / 6</p><p>Всего верно сейчас ${now} / ${tasks.length}.<br>Карточек просмотрено ${Object.keys(state.seen).length} / ${expressions.length}.</p><h3>You can now…</h3><ul><li>Ask about someone’s job.</li><li>React naturally to simple information.</li><li>Understand an invitation.</li><li>Accept an invitation politely.</li></ul><div class="actions"><button data-action="review">Review Mistakes</button><button class="secondary" data-action="reset">Practice Again</button></div>`;}
function update(){const done=tasks.filter(t=>state.records[t.id]?.last).length;const seen=Object.keys(state.seen).length;el('bar').style.width=(done+seen)/(tasks.length+expressions.length)*100+'%';el('progress').textContent=`Карточки ${seen} / 9 · Верно ${done} / ${tasks.length}`;el('nav').innerHTML=stageNames.map((name,i)=>`<button class="secondary" data-stage="${i}" aria-current="${!state.review&&state.stage===i?'step':'false'}">${i+1}. ${name}</button>`).join('');persist();}
function render(scroll=false){let html;if(state.review){const task=current();html=`<h2>Review Mistakes</h2><p class="small">Первоначальные ошибки сохраняются. Исправленные ответы отмечены.</p>${task?`<p class="small">${state.records[task.id]?.last?'Ошибка исправлена':'На повторение'}</p>${question(task)}`:'<p class="note">Раунд повторения завершён.</p>'}`;}else if(state.stage===0)html=cardsHTML();else if(state.stage===2)html=`<h2>Complete the Dialogue</h2><p>Выбери пропуск, затем подходящую фразу. Каждую фразу используй один раз в своём диалоге.</p>${bankDialogue(0)}${bankDialogue(1)}<div class="actions page-actions"><button class="secondary" data-stage="1">Previous</button><button data-stage="3">Quick Review</button></div>`;else if(state.stage===3&&state.finished)html=resultHTML();else html=`<h2>${stageNames[state.stage]}</h2><p class="small">Choose the most natural response.</p>${question(current())}`;el('app').innerHTML=html;update();if(scroll)el('app').scrollIntoView({block:'start'});}
document.addEventListener('click',event=>{const button=event.target.closest('button');if(!button)return;const d=button.dataset;
 if(d.stage!==undefined){state.stage=+d.stage;state.review=false;render(true);return;}
 if(d.card!==undefined){const i=+d.card;state.cards[i]=!state.cards[i];state.seen[i]=true;button.classList.toggle('flipped',state.cards[i]);button.setAttribute('aria-expanded',String(state.cards[i]));update();return;}
 if(d.option){const task=current();state.answers[task.id]=d.option;record(task);render();return;}
 if(d.retry){clear(tasks.find(t=>t.id===d.retry));render();return;}
 if(d.target){const [group,blank]=d.target.split(':').map(Number);state.targets[group]=blank;render();return;}
 if(d.bank!==undefined){const group=+d.bank;const rows=tasks.filter(t=>t.stage===2&&t.dialogue===group);const task=rows[state.targets[group]];state.answers[task.id]=d.value;if(state.records[task.id])state.records[task.id].last=null;const next=rows.findIndex(t=>!state.answers[t.id]);state.targets[group]=next<0?0:next;render();return;}
 if(d.checkDialogue!==undefined){const group=+d.checkDialogue;const rows=tasks.filter(t=>t.stage===2&&t.dialogue===group);rows.forEach(record);render();if(rows.some(t=>!state.answers[t.id]))el('dialogue-feedback-'+group).innerHTML+='<p class="note">Заполни все три пропуска.</p>';return;}
 if(d.action==='start'){state.stage=1;render(true);return;}
 if(d.action==='previous'){if(state.review)state.reviewPosition--;else state.positions[state.stage]=position()-1;render();return;}
 if(d.action==='next'){if(state.review)state.reviewPosition++;else if(position()<list().length-1)state.positions[state.stage]=position()+1;else if(state.stage===3)state.finished=true;else state.stage++;render(true);return;}
 if(d.action==='review'){state.reviewIds=shuffle(Object.keys(state.mistakes));state.reviewPosition=0;state.review=true;state.reviewIds.forEach(id=>clear(tasks.find(t=>t.id===id)));render(true);return;}
 if(d.action==='reset'&&confirm('Начать тренажёр заново? Ответы и прогресс будут сброшены.')){state=fresh();render(true);}
});
render();
</script></body></html>
