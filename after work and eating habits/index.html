<body>
<div class="wrap">
<header class="hero">
<p class="eyebrow">Vocabulary practice · Daily routine</p>
<h1>After work<br>&amp; in the evening</h1>
<p>Recall the expressions, choose the right phrase, complete the sentences, and use the vocabulary to talk about your evening.</p>
</header>
<div class="topline">
<div style="flex:1"><div class="progress-label" id="progressText">Cards marked as recalled: 0 / 31</div><div class="progress"><span id="progressBar"></span></div></div>
<button class="reset" id="resetProgress">Reset card progress</button>
</div>
<nav class="nav" aria-label="Practice sections">
<button class="active" data-view="cards">1. Recall cards</button>
<button data-view="choice">2. Choose</button>
<button data-view="gaps">3. Gaps</button>

<p class="footer">Your card progress is saved in this browser.</p>
</div>
<script>

const vocab=[
{id:"eatout",group:"Food & shopping",phrase:"to eat out",ru:"есть вне дома; ходить в кафе или ресторан",ex:"We don't feel like cooking. Let's ______ tonight.",clue:"You choose a café or restaurant instead of eating at home.",gap:"We don't feel like cooking. Let's ______ tonight.",answers:["eat out"]},

{id:"dodishes",group:"Coming home & chores",phrase:"to do the dishes",ru:"заняться посудой; помыть посуду",ex:"I'll ______ while you dry them.",clue:"The usual household chore of washing the dirty dishes.",gap:"I'll ______ while you dry them.",answers:["do the dishes","do dishes"]},

{id:"listenmusic",group:"Free time & people",phrase:"to listen to music",ru:"слушать музыку",ex:"I like to ______ while I cook.",clue:"You put on a playlist and hear songs.",gap:"I like to ______ while I cook.",answers:["listen to music"]},
{id:"watchseries",group:"Free time & people",phrase:"to watch a series",ru:"смотреть сериал",ex:"We sometimes ______ after dinner.",clue:"You watch episodes of a TV show.",gap:"We sometimes ______ after dinner.",answers:["watch a series","watch a TV series","watch series"]},
{id:"notifications",group:"Free time & people",phrase:"to check notifications",ru:"проверять уведомления",ex:"I want to ______ on my phone.",clue:"You look at new alerts on your phone.",gap:"I want to ______ on my phone.",answers:["check notifications"]},

{id:"family",group:"Free time & people",phrase:"to call your family",ru:"звонить семье",ex:"I try to ______ every week.",clue:"You phone your parents or other relatives.",gap:"I try to ______ every week.",answers:["call your family"]},
{id:"homework",group:"Free time & people",phrase:"to do homework",ru:"делать домашнее задание",ex:"She needs to ______ before dinner.",clue:"You complete school or study tasks at home.",gap:"She needs to ______ before dinner.",answers:["do homework"]},
{id:"walkdog",group:"Family, pets & bedtime",phrase:"to walk the dog",ru:"выгуливать собаку",ex:"I ______ twice a day.",clue:"You take the dog outside for exercise and a bathroom break.",gap:"I ______ twice a day.",answers:["walk the dog"]},

{id:"feeddog",group:"Family, pets & bedtime",phrase:"to feed the dog",ru:"кормить собаку",ex:"It's time to ______.",clue:"The dog's bowl is empty. Give the dog some food.",gap:"It's time to ______.",answers:["feed the dog"]},
{id:"feedkids",group:"Family, pets & bedtime",phrase:"to feed the kids",ru:"кормить детей",ex:"I'll ______ before we leave.",clue:"The children are hungry. Give them something to eat.",gap:"I'll ______ before we leave.",answers:["feed the kids"]},
{id:"putkids",group:"Family, pets & bedtime",phrase:"to put the kids to bed",ru:"укладывать детей спать",ex:"They ______ at eight.",clue:"You help the children get ready for sleep and tuck them in.",gap:"They ______ at eight.",answers:["put the kids to bed","put kids to bed"]},
{id:"gotobed",group:"Family, pets & bedtime",phrase:"to go to bed",ru:"ложиться спать",ex:"I usually ______ before eleven.",clue:"You get into bed at the end of the day.",gap:"I usually ______ before eleven.",answers:["go to bed"]},
{id:"fallasleep",group:"Family, pets & bedtime",phrase:"to fall asleep",ru:"засыпать",ex:"I'm tired, but I can't ______.",clue:"You stop being awake and begin sleeping.",gap:"I'm tired, but I can't ______.",answers:["fall asleep"]}
];
const choiceClues={
eatout:"You choose a café or restaurant instead of eating at home.",
cutdown:"You reduce how much coffee you drink, but don't stop completely.",
cutout:"You decide to stop eating sugar completely.",
buygroceries:"The fridge is empty, so you go shopping for food and household basics.",
cookdinner:"You prepare the evening meal.",
havedinner:"You sit down and eat the evening meal.",
drinkcoffee:"You consume a cup of coffee or tea.",
havecoffee:"You offer someone a cup: “Would you like to ___ coffee with me?”",
gohome:"You're at work and are leaving to head home.",
comehome:"You're at home and ask someone when they will return.",
housework:"You mean general cleaning and jobs around the home.",
chores:"You mean regular household tasks people are responsible for.",
cleartable:"You remove the plates and glasses after dinner.",
cleantable:"You wipe a dirty surface.",
washdishes:"You focus on washing the plates and cups.",
dodishes:"You take care of the dishwashing as a household chore.",
trash:"The bin is full, so you carry the rubbish outside.",
listenmusic:"You put on a playlist and hear songs.",
watchseries:"You watch episodes of a TV show.",
notifications:"You look at new alerts on your phone.",
news:"You read current events on a website or app.",
friends:"You leave home to spend time socially with your friends.",
family:"You phone your parents or other relatives.",
homework:"You complete school or study tasks at home.",
walkdog:"You take the dog outside for exercise.",
feedcat:"The cat's bowl is empty. Give the cat some food.",
feeddog:"The dog's bowl is empty. Give the dog some food.",
feedkids:"The children are hungry. Give them something to eat.",
putkids:"You help the children get ready for sleep and tuck them in.",
gotobed:"You get into bed at the end of the day.",
fallasleep:"You stop being awake and begin sleeping."
};
const groups=[...new Set(vocab.map(x=>x.group))];
const app=document.getElementById("app");
let view="cards", cardFilter="All groups", choiceIndex=0, choiceScore=0, choiceAnswered=false, gapIndex=0, gapScore=0, gapAnswered=false;
let chosen=vocab[0];
const learned=new Set(JSON.parse(localStorage.getItem("eveningTrainerLearned")||"[]"));
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function persist(){localStorage.setItem("eveningTrainerLearned",JSON.stringify([...learned]));updateProgress()}
function updateProgress(){document.getElementById("progressText").textContent="Cards marked as recalled: "+learned.size+" / "+vocab.length;document.getElementById("progressBar").style.width=(learned.size/vocab.length*100)+"%"}
function sentenceWithBlank(s){return esc(s).replace("______","<span style='letter-spacing:.12em;color:#8b82cf'>________</span>")}
function showCards(){
 const shown=cardFilter==="All groups"?groups:groups.filter(x=>x===cardFilter);
 app.innerHTML="<div class='panelhead'><div><h2>Recall the expressions</h2><p class='lead'>Look at the Russian prompt and the English example. Say the expression before revealing it.</p></div><span class='counter'>"+vocab.length+" expressions</span></div><div class='filter' id='filters'></div><div id='cardGroups'></div>";
 const filters=document.getElementById("filters");
 ["All groups",...groups].forEach(g=>{const b=document.createElement("button");b.textContent=g;b.className=cardFilter===g?"active":"";b.onclick=()=>{cardFilter=g;showCards()};filters.appendChild(b)});
 const root=document.getElementById("cardGroups");
 shown.forEach(g=>{const items=vocab.filter(v=>v.group===g);const sec=document.createElement("section");sec.className="group";sec.innerHTML="<h3>"+esc(g)+"</h3><div class='cards'></div>";const grid=sec.querySelector(".cards");items.forEach(v=>{const card=document.createElement("article");card.className="wordcard"+(learned.has(v.id)?" revealed":"");card.innerHTML="<p class='ru'>"+esc(v.ru)+"</p><p class='example'>"+sentenceWithBlank(v.ex)+"</p><p class='answer'>"+esc(v.phrase)+"</p><div class='cardactions'><button class='smallbtn reveal'>"+(card.classList.contains("revealed")?"Hide answer":"Show answer")+"</button><button class='smallbtn recall "+(learned.has(v.id)?"done":"")+"'>"+(learned.has(v.id)?"Recalled":"I remembered it")+"</button></div>";card.querySelector(".reveal").onclick=e=>{card.classList.toggle("revealed");e.currentTarget.textContent=card.classList.contains("revealed")?"Hide answer":"Show answer"};card.querySelector(".recall").onclick=e=>{if(learned.has(v.id)){learned.delete(v.id)}else learned.add(v.id);persist();e.currentTarget.classList.toggle("done",learned.has(v.id));e.currentTarget.textContent=learned.has(v.id)?"Recalled":"I remembered it"};grid.appendChild(card)});root.appendChild(sec)});
}
function shuffled(a){return [...a].sort(()=>Math.random()-.5)}
function showChoice(){
 const v=vocab[choiceIndex];
 const same=vocab.filter(x=>x.group===v.group&&x.id!==v.id);
 let distractors=shuffled(same).slice(0,3);
 if(distractors.length<3)distractors=shuffled(vocab.filter(x=>x.id!==v.id)).slice(0,3);
 const opts=shuffled([v,...distractors]);
 app.innerHTML="<div class='panelhead'><div><h2>Choose the expression</h2><p class='lead'>Read the situation and choose the expression that fits best.</p></div><span class='counter'>Question "+(choiceIndex+1)+" / "+vocab.length+" · Score "+choiceScore+"</span></div><div class='context'>"+esc(choiceClues[v.id])+"</div><div class='options'></div><div class='feedback' id='choiceFeedback' aria-live='polite'></div><div class='actions'><button class='primary' id='choiceNext' disabled>"+(choiceIndex===vocab.length-1?"See result":"Next")+"</button><button class='secondary' id='choiceRestart'>Restart</button></div>";
 const box=app.querySelector(".options");
 opts.forEach(o=>{const b=document.createElement("button");b.className="option";b.textContent=o.phrase;b.onclick=()=>{if(choiceAnswered)return;choiceAnswered=true;const ok=o.id===v.id;if(ok)choiceScore++;b.classList.add(ok?"correct":"wrong");opts.forEach(x=>{if(x.id===v.id)box.querySelectorAll(".option").forEach(btn=>{if(btn.textContent===x.phrase)btn.classList.add("correct")})});const fb=document.getElementById("choiceFeedback");fb.className="feedback "+(ok?"good":"bad");fb.textContent=ok?"Correct. "+v.phrase+" – "+v.ru:"Not quite. The best answer is "+v.phrase+" – "+v.ru;document.getElementById("choiceNext").disabled=false};box.appendChild(b)});
 document.getElementById("choiceNext").onclick=()=>{if(choiceIndex===vocab.length-1){app.innerHTML="<div class='endcard'><h2>Choice practice complete</h2><p>You got <strong>"+choiceScore+" / "+vocab.length+"</strong> correct.</p><button class='primary' id='choiceAgain'>Try again</button></div>";document.getElementById("choiceAgain").onclick=()=>{choiceIndex=0;choiceScore=0;choiceAnswered=false;showChoice()};return}choiceIndex++;choiceAnswered=false;showChoice()};
 document.getElementById("choiceRestart").onclick=()=>{choiceIndex=0;choiceScore=0;choiceAnswered=false;showChoice()};
}
function normalize(s){return s.toLowerCase().trim().replace(/[.!?,;:]/g,"").replace(/\s+/g,"").replace(/’/g,"'")}
function showGaps(){
 const v=vocab[gapIndex];
 app.innerHTML="<div class='panelhead'><div><h2>Complete the sentence</h2><p class='lead'>Type the missing expression. Each phrase from the list appears in this round.</p></div><span class='counter'>Question "+(gapIndex+1)+" / "+vocab.length+" · Score "+gapScore+"</span></div><div class='context'>"+sentenceWithBlank(v.gap)+"</div><div class='inputrow'><input id='gapInput' autocomplete='off' aria-label='Type the missing expression' placeholder='Type the expression'><button class='primary' id='gapCheck'>Check</button></div><div class='feedback' id='gapFeedback' aria-live='polite'></div><div class='actions'><button class='primary' id='gapNext' disabled>"+(gapIndex===vocab.length-1?"See result":"Next")+"</button><button class='secondary' id='gapRestart'>Restart</button></div>";
 const input=document.getElementById("gapInput"),check=document.getElementById("gapCheck"),feedback=document.getElementById("gapFeedback"),next=document.getElementById("gapNext");
 function test(){if(gapAnswered)return;const answer=normalize(input.value);if(!answer){feedback.textContent="Type an expression first.";return}gapAnswered=true;const ok=v.answers.some(a=>normalize(a)===answer);if(ok)gapScore++;feedback.className="feedback "+(ok?"good":"bad");feedback.textContent=ok?"Correct. "+v.phrase+" – "+v.ru:"The answer is "+v.phrase+". "+v.ru;next.disabled=false;check.disabled=true;input.disabled=true}
 check.onclick=test;input.onkeydown=e=>{if(e.key==="Enter")test()};
 next.onclick=()=>{if(gapIndex===vocab.length-1){app.innerHTML="<div class='endcard'><h2>Gap practice complete</h2><p>You got <strong>"+gapScore+" / "+vocab.length+"</strong> correct.</p><button class='primary' id='gapAgain'>Try again</button></div>";document.getElementById("gapAgain").onclick=()=>{gapIndex=0;gapScore=0;gapAnswered=false;showGaps()};return}gapIndex++;gapAnswered=false;showGaps()};
 document.getElementById("gapRestart").onclick=()=>{gapIndex=0;gapScore=0;gapAnswered=false;showGaps()};
}
const repairs=[
{sentence:"I want to stop eating sugar completely, so I’m going to cut down on sugar.",wrong:"cut down on",answer:"cut out",explain:"Use cut out when you stop completely."},
{sentence:"The plates are still on the table. I’ll clean the table.",wrong:"clean the table",answer:"clear the table",explain:"Clear the table means remove the dishes and other things."},
{sentence:"There’s sauce on the table. I’ll clear the table.",wrong:"clear the table",answer:"clean the table",explain:"Clean the table means wipe the surface."},
{sentence:"I went to bed at ten, but I didn’t go to bed until midnight.",wrong:"go to bed (second time)",answer:"fall asleep",explain:"Go to bed is getting into bed; fall asleep is beginning to sleep."},
{sentence:"I’m at home. What time will you go home?",wrong:"go home",answer:"come home",explain:"From the speaker’s point of view at home, ask when someone will come home."},
{sentence:"I don’t want to reduce coffee slowly. I want to cut down on it completely.",wrong:"cut down on",answer:"cut out",explain:"Cut out means stop completely."},
{sentence:"The bin is full. I need to clear the trash.",wrong:"clear the trash",answer:"take out the trash",explain:"Take out the trash is the usual expression."},
{sentence:"I want to reduce the amount of coffee I drink, so I’ll cut it out a little.",wrong:"cut it out a little",answer:"cut down on it",explain:"Cut down on means reduce the amount."}
];
let repairScore=0;
function showRepair(){app.innerHTML="<div class='panelhead'><div><h2>Fix the phrase</h2><p class='lead'>Replace the incorrect expression. Focus on the meaning, not spelling or punctuation.</p></div><span class='counter'>"+repairs.length+" sentences</span></div><div class='cards' id='repairCards'></div><div class='feedback' id='repairResult'></div><button class='primary' id='checkRepairs'>Check answers</button>";const root=document.getElementById("repairCards");repairs.forEach((r,i)=>{const el=document.createElement("div");el.className="wordcard";el.innerHTML="<p class='example'>"+esc(r.sentence)+"</p><label class='counter' for='rep"+i+"'>Replace: <strong>"+esc(r.wrong)+"</strong></label><div class='inputrow'><input id='rep"+i+"' data-answer='"+esc(r.answer)+"' placeholder='Type the correct expression'></div><p class='feedback hidden' id='rf"+i+"'></p>";root.appendChild(el)});document.getElementById("checkRepairs").onclick=()=>{repairScore=0;repairs.forEach((r,i)=>{const input=document.getElementById("rep"+i),fb=document.getElementById("rf"+i),ok=normalize(input.value)===normalize(r.answer);if(ok)repairScore++;fb.classList.remove("hidden");fb.className="feedback "+(ok?"good":"bad");fb.textContent=ok?"Correct. "+r.explain:"Suggested correction: "+r.answer+". "+r.explain});document.getElementById("repairResult").className="feedback";document.getElementById("repairResult").textContent="Score: "+repairScore+" / "+repairs.length;}}
const speakingPrompts=[
"Describe what you usually do when you come home after work.",
"Talk about how you handle dinner, groceries, and the dishes.",
"Describe what you do to relax in the evening.",
"Talk about the household chores you do during the week.",
"Describe your usual routine before you go to bed.",
"Talk about how often you spend time with friends or call your family."
];
let currentPrompt="";
function showSpeaking(){currentPrompt=currentPrompt||speakingPrompts[0];app.innerHTML="<div class='panelhead'><div><h2>Talk about your evening</h2><p class='lead'>Choose a prompt and answer aloud. Try to use at least three expressions from the list.</p></div></div><div class='endcard'><p class='eyebrow'>Speaking prompt</p><div class='question' id='speakPrompt'>"+esc(currentPrompt)+"</div><button class='secondary' id='newPrompt'>Another prompt</button></div><h3 style='margin:22px 0 8px;font-size:15px'>Optional phrase bank</h3><div class='bank'>"+vocab.map(v=>"<span class='chip'>"+esc(v.phrase)+"</span>").join("")+"</div><p class='note'>After speaking, check: Did I use three or more expressions? Did I distinguish <strong>go to bed</strong> from <strong>fall asleep</strong> and <strong>cut down on</strong> from <strong>cut out</strong>?</p>";document.getElementById("newPrompt").onclick=()=>{let next=shuffled(speakingPrompts).find(x=>x!==currentPrompt)||speakingPrompts[0];currentPrompt=next;showSpeaking()}}
function render(){updateProgress();if(view==="cards")showCards();if(view==="choice")showChoice();if(view==="gaps")showGaps();if(view==="repair")showRepair();if(view==="speak")showSpeaking()}
document.querySelectorAll(".nav button").forEach(b=>b.onclick=()=>{document.querySelectorAll(".nav button").forEach(x=>x.classList.remove("active"));b.classList.add("active");view=b.dataset.view;render()});
document.getElementById("resetProgress").onclick=()=>{learned.clear();persist();if(view==="cards")showCards()};
render();
</script>
