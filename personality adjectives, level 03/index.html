function shuffle(values) {
  const result = [...values];
  for (let i = result.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [result[i], result[j]] = [result[j], result[i]];
  }
  return result;
}

function escapeHtml(value) {
  return String(value).replace(/[&<>"']/g, character => ({
    "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;"
  })[character]);
}

function markup(value) {
  return escapeHtml(value).replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
}

function normalize(value) {
  return value.toLowerCase().trim()
    .replace(/[’‘]/g, "'")
    .replace(/[\u2010-\u2014\u2212-]/g, " ")
    .replace(/\s+/g, " ")
    .replace(/[.!?]+$/, "")
    .replace(/\btake out food\b/g, "takeout food");
}

function control(key, number, answer, explanation, distractors, inline) {
  definitions.set(key, {number, answer, explanation});
  if (distractors.length) {
    // Cycle through randomized answer positions for each group and option count.
    const group = key.replace(/\d+$/, "") + distractors.length;
    const queue = choicePositions.get(group) || [];
    if (!queue.length) queue.push(...shuffle(Array.from({length: distractors.length + 1}, (_, index) => index)));
    const options = shuffle(distractors);
    options.splice(queue.shift(), 0, answer);
    choicePositions.set(group, queue);
    if (inline) {
      return '<select data-control aria-label="Gap ' + number + '"><option value="">Choose…</option>' +
        options.map(option => '<option>' + escapeHtml(option) + '</option>').join("") + '</select>';
    }
    return '<div class="choices" role="group" aria-labelledby="' + key + '-prompt">' +
      options.map(option => '<label><input data-control type="radio" name="' + key + '" value="' +
        escapeHtml(option) + '"> ' + escapeHtml(option) + '</label>').join("") + '</div>';
  }
  const label = inline ? 'aria-label="Gap ' + number + '"' : 'aria-labelledby="' + key + '-prompt"';
  return '<input data-control type="text" ' + label + ' autocomplete="off" autocapitalize="none" spellcheck="false" ' +
    'style="--width:' + Math.max(9, answer.length + 3) + 'ch">';
}

const feedback = '<div class="feedback" lang="ru" aria-live="polite"></div>';
const footer = '<div class="actions"><button class="primary" data-check type="button">Check answers</button>' +
  '<span class="score" aria-live="polite"></span></div>';

function exerciseRows(rows, prefix, firstLetter = false) {
  return rows.map(([prompt, answer, explanation, options = ""], index) => {
    const number = index + 1;
    const key = prefix + number;
    const hint = firstLetter ? '<button type="button" class="hint" data-hint>First letter</button>' : "";
    return '<div class="item" data-key="' + key + '"><p id="' + key + '-prompt">' + number + '. ' +
      markup(prompt) + '</p>' + control(key, number, answer, explanation, options ? options.split("|") : [], false) +
      hint + feedback + '</div>';
  }).join("");
}

function storyBody(text) {
  return text.split("\n\n").map(paragraph => '<p class="story">' +
    markup(paragraph).replace(/\n/g, "<br>").replace(/\{(\d+)\}/g, (_, digits) => {
      const number = Number(digits);
      const key = "gap" + number;
      const [answer, explanation, distractor] = storyAnswers[number - 1];
      return '<span class="gap" data-key="' + key + '"><b>' + number + '</b>' +
        control(key, number, answer, explanation, distractor ? [distractor] : [], true) + '</span>';
    }) + '</p>').join("");
}

function renderStory() {
  return story.map(([title, blocks]) => '<div class="check-group"><h3>' + title + '</h3>' +
    blocks.map(([ids, content]) => {
      const bank = ids.length ? '<div class="bank"><strong>Word bank</strong><br>' +
        shuffle(ids).map(id => '<span>' + escapeHtml(storyAnswers[id - 1][0]) + '</span>').join("") + '</div>' :
        '<p class="muted">Choose the best verb form.</p>';
      const results = [...content.matchAll(/\{(\d+)\}/g)].map(([, number]) =>
        '<div class="feedback" lang="ru" aria-live="polite" id="result-gap' + number + '"></div>').join("");
      return bank + storyBody(content) + '<div class="results">' + results + '</div>';
    }).join("") + footer + '</div>').join("<hr>");
}

const sections = [
["Guess the trait", "Read each situation and choose the adjective that best describes the person.",
  () => exerciseRows(quiz.map(([prompt, answer, options, reason]) => [prompt, answer, reason, options]), "quiz")],
["Choose the best word", "Choose the word that matches the clue in bold.",
  () => exerciseRows(distinctions.map(([prompt, answer, options, reason]) => [prompt, answer, reason, options]), "choose")],
["Write the opposite", "Type the opposite of the adjective in parentheses. Write the whole word.",
  () => exerciseRows(opposites.map(([word, answer, prompt, reason]) =>
    [prompt + " **(" + word + ")**", answer, answer.slice(0, -word.length) + "- + " + word + ". " + reason]), "opposite")],
["Recall the word", "Type one adjective from this lesson. Try from memory first. Use First letter if you get stuck.",
  () => exerciseRows(recall, "recall", true)],
["Complete the story", "Type the missing words and phrases from each box. Where you see options, choose the best verb form.",
  renderStory]
];

const taskContainer = document.querySelector("#tasks");
const navigation = document.querySelector("#navigation");
const progress = document.querySelector("#progress");
const review = document.querySelector("#review");
const storageKey = "aef3-personality-revision-v1";
let saved = {};
try { saved = JSON.parse(localStorage.getItem(storageKey)) || {}; } catch {}
const correct = new Set();

taskContainer.innerHTML = sections.map(([title, instruction, render], index) => {
  const number = index + 1;
  const intro = '<h2 tabindex="-1">Task ' + number + ' – ' + title + '</h2>' +
    (number === 5 ? '<h3>A family lunch with a few complications</h3>' : "") +
    '<p>' + instruction + '</p>';
  const content = number === 5 ? render() : '<div class="check-group">' + render() + footer + '</div>';
  const next = number < 5 ? '<div class="actions"><button data-task="' + (number + 1) + '">Next task</button></div>' : "";
  return '<section id="task-' + number + '" hidden>' + intro + content + next + '</section>';
}).join("");

navigation.innerHTML = sections.map(([title], index) =>
  '<button type="button" data-task="' + (index + 1) + '" aria-controls="task-' + (index + 1) +
  '" title="' + title + '">Task ' + (index + 1) + '</button>').join("");

document.querySelector("#review-content").innerHTML =
  '<details class="review" open><summary>Personality adjectives</summary><div class="deck">' +
  vocabulary.map(([word, phrase, translation, example]) =>
    '<details><summary>' + word + ' · <em>' + phrase + '</em></summary><p lang="ru">' + translation +
    '</p><p>' + example + '</p></details>').join("") + '</div></details>' +
  '<details class="review"><summary>Opposites</summary><div class="deck">' +
  opposites.map(([word, answer]) => '<details><summary>' + word + '</summary><p>' + answer + '</p></details>').join("") +
  '</div></details>';

function selectTask(number, focus = false) {
  for (const section of taskContainer.querySelectorAll("section")) section.hidden = section.id !== "task-" + number;
  for (const button of navigation.querySelectorAll("button")) button.setAttribute("aria-current", String(button.dataset.task === String(number)));
  if (focus) {
    const heading = document.querySelector("#task-" + number + " h2");
    heading.focus({preventScroll:true});
    heading.scrollIntoView({block:"start"});
  }
}

function valueOf(item) {
  return item.querySelector("input:checked, input[type=text], select")?.value || "";
}

function resultFor(item) {
  return document.getElementById("result-" + item.dataset.key) || item.querySelector(".feedback");
}

function updateProgress() {
  progress.textContent = correct.size + " / " + definitions.size + " correct";
}

function checkItem(item, reveal = false) {
  const key = item.dataset.key;
  const {number, answer, explanation} = definitions.get(key);
  const value = valueOf(item);
  const right = normalize(value) === normalize(answer);
  const status = right ? "right" : value.trim() ? "retry" : "";
  const result = resultFor(item);
  const prefix = item.classList.contains("gap") ? number + ". " : "";
  item.dataset.state = status;
  item.classList.toggle("right", right);
  item.classList.toggle("retry", status === "retry");
  result.classList.toggle("right", right);
  result.classList.toggle("retry", status === "retry");
  if (right || reveal) {
    result.innerHTML = escapeHtml(prefix) + "<strong>" + escapeHtml(answer) + "</strong> – " + escapeHtml(explanation);
  } else {
    const message = value.trim() ? "Попробуй ещё раз." : "Добавь ответ, чтобы проверить этот пункт.";
    result.innerHTML = escapeHtml(prefix + message) + '<button data-reveal="' + key +
      '" lang="en" type="button">Show answer</button>';
  }
  if (right) correct.add(key);
  else correct.delete(key);
  return right;
}

for (const item of taskContainer.querySelectorAll("[data-key]")) {
  const key = item.dataset.key;
  if (typeof saved[key] !== "string") continue;
  for (const field of item.querySelectorAll("[data-control]")) {
    if (field.type === "radio") field.checked = field.value === saved[key];
    else field.value = saved[key];
  }
  if (normalize(valueOf(item)) === normalize(definitions.get(key).answer)) checkItem(item);
}

document.querySelector("#review-open").addEventListener("click", () => review.showModal());
document.addEventListener("click", event => {
  const button = event.target.closest("button");
  if (!button) return;
  if (button.dataset.task) selectTask(Number(button.dataset.task), true);
  if (button.hasAttribute("data-check")) {
    const group = button.closest(".check-group");
    const items = [...group.querySelectorAll("[data-key]")];
    const total = items.filter(item => checkItem(item)).length;
    group.querySelector(".score").textContent = total + " / " + items.length + " correct";
    updateProgress();
    if (group.querySelector(".story")) {
      const first = items.find(item => !correct.has(item.dataset.key)) || items[0];
      resultFor(first).scrollIntoView({block:"center"});
    }
  }
  if (button.dataset.reveal) {
    const item = taskContainer.querySelector('[data-key="' + button.dataset.reveal + '"]');
    checkItem(item, true);
    item.querySelector("[data-control]").focus({preventScroll:true});
  }
  if (button.hasAttribute("data-hint")) {
    const item = button.closest("[data-key]");
    button.textContent = "First letter – " + definitions.get(item.dataset.key).answer[0] + "…";
  }
});

taskContainer.addEventListener("input", event => {
  const item = event.target.closest("[data-key]");
  if (!item) return;
  const key = item.dataset.key;
  saved[key] = valueOf(item);
  try { localStorage.setItem(storageKey, JSON.stringify(saved)); } catch {}
  correct.delete(key);
  item.classList.remove("right", "retry");
  item.dataset.state = "";
  const result = resultFor(item);
  result.replaceChildren();
  result.classList.remove("right", "retry");
  item.closest(".check-group").querySelector(".score").textContent = "";
  updateProgress();
});

selectTask(1);
updateProgress();
</script>
</main>
</body>
</html>
