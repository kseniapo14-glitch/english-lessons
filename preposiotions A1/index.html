[['Where ___ the pen?','is'],['Where ___ the sunglasses?','are'],['The laptop ___ on the desk.','is'],['The coins ___ in the wallet.','are'],['Where ___ the watch?','is'],['The earphones ___ in the bag.','are']].forEach(([p,a])=>choice(5,p,['is','are'],a==='is'?0:1,a==='is'?one:many,{group:'A · Is или are'}));
[['Where’s the tablet? — ___ on the desk.','It’s'],['Where are the keys? — ___ in the bag.','They’re'],['Where are the glasses? — ___ on the notebook.','They’re'],['Where’s the dictionary? — ___ under the laptop.','It’s'],['Where’s the ticket? — ___ in the wallet.','It’s'],['Where are the scissors? — ___ under the notebook.','They’re']].forEach(([p,a])=>choice(5,p,['It’s','They’re'],a==='It’s'?0:1,a==='It’s'?one:many,{group:'B · It’s или They’re'}));
[['Where is the phone?',['the','Where','phone','is','?']],['It is in the bag.',['in','It','is','bag','the','.']],['Where are the keys?',['keys','Where','the','are','?']],['They are under the notebook.',['under','notebook','They','are','the','.']],['Where is the watch?',['Where','watch','the','is','?']],['It is on the desk.',['desk','on','the','It','is','.']],['Where are the glasses?',['the','are','glasses','Where','?']],['They are on the dictionary.',['They','are','dictionary','on','the','.']]].forEach(([a,t])=>add(6,'order',a.includes('?')?'Собери вопрос.':'Собери ответ.',a,a.includes('are')?many:one,{tokens:t}));
const detective=[[3,'on','desk'],[4,'in','bag'],[2,'on','notebook',2],[6,'under','desk'],[24,'on','dictionary'],[5,'in','bag']];
const memory=[[17,'on','desk'],[23,'in','bag'],[13,'under','notebook'],[18,'on','dictionary'],[19,'in','wallet',3]];
function answer(pl,prep,container){return [(pl?'They are ':'It is ')+prep+' the '+container+'.']}
function locationTasks(s,list,nouns,pls){list.forEach((sc,i)=>add(s,'text',`Where ${pls[i]?'are':'is'} the ${nouns[i]}?`,answer(pls[i],sc[1],sc[2]),(pls[i]?many:one)+' '+rules[sc[1]],{context:'Ответь: It’s… / They’re…'}))}
locationTasks(7,detective,['laptop','phone','keys','wallet','glasses','charger'],[0,0,1,0,1,0]);locationTasks(8,memory,['tablet','headphones','pen','ticket','coins'],[0,1,0,0,1]);
add(9,'gaps','— Where ___ the phone?\n— It’s ___ the bag.\n— Where ___ the keys?\n— They’re ___ the notebook.\n— And where ___ the glasses?\n— They’re ___ the desk!',[],one+' '+many+' In — внутри, under — под, on — на поверхности.',{groups:[['is'],['in'],['are'],['under'],['are'],['on']]});
const translations=[['Где ноутбук? Он на столе.','laptop',0,'on','desk'],['Где ключи? Они в сумке.','keys',1,'in','bag'],['Где ручка? Она под блокнотом.','pen',0,'under','notebook'],['Где очки? Они на словаре.','glasses',1,'on','dictionary'],['Где бумажник? Он под столом.','wallet',0,'under','desk'],['Где наручные часы? Они на блокноте.','watch',0,'on','notebook'],['Где ножницы? Они под листом бумаги.','scissors',1,'under','piece of paper'],['Где зарядное устройство? Оно в сумке.','charger',0,'in','bag'],['Где билет? Он в бумажнике.','ticket',0,'in','wallet'],['Где наушники с оголовьем? Они на столе.','headphones',1,'on','desk']];translations.forEach(([p,n,pl,prep,c])=>add(10,'text',p,`Where ${pl?'are':'is'} the ${n}? ${answer(pl,prep,c)[0]}`,(pl?many:one)+' '+rules[prep]));
[['Телефон внутри сумки. Какой предлог нужен?',['in','on','under'],0,rules.in],['Ручка на поверхности блокнота. Какой предлог нужен?',['under','on','in'],1,rules.on],['Ключи под сумкой. Какой предлог нужен?',['on','in','under'],2,rules.under],['Выбери правильный вопрос.',['Where is the phone?','Where are the phone?'],0,one],['Выбери правильный вопрос.',['Where is the glasses?','Where are the glasses?'],1,'Glasses — множественная форма. '+many],['Where’s the watch?',['It’s on the desk.','They’re on the desk.'],0,'Watch — один предмет. '+one],['Что означает Where’s?',['Where is','Where are'],0,'Where’s = Where is. Для Where are такое сокращение здесь не используем.'],['Where are the scissors?',['It’s under the notebook.','They’re under the notebook.'],1,'Scissors — множественная форма. '+many]].forEach(([p,o,c,w])=>choice(11,p,o,c,w,{auto:true}));
const theory={0:`<div class="theory"><h3>Предлоги места показывают, где находится предмет</h3><p><b>in</b> — внутри<br><b>on</b> — на поверхности<br><b>under</b> — под</p></div><div class="gallery">${picture([13,'in','bag'])}${picture([13,'on','bag'])}${picture([13,'under','bag'])}</div><div class="note"><b>The phone is in the bag.</b> — Телефон в сумке.<br><b>The pen is on the notebook.</b> — Ручка на блокноте.<br><b>The keys are under the bag.</b> — Ключи под сумкой.</div>`,1:`<div class="theory"><h3>Один предмет → Where is…?</h3><p><b>Where is the phone? — It is in the bag.</b><br>Коротко: <b>Where’s the phone? — It’s in the bag.</b></p><h3>Несколько предметов → Where are…?</h3><p><b>Where are the keys? — They are in the bag.</b><br>Коротко: <b>Where are the keys? — They’re in the bag.</b></p></div><div class="note"><b>Where’s = Where is<br>It’s = It is<br>They’re = They are</b><p>Glasses, sunglasses, scissors, headphones, earphones — множественные формы: <b>Where are…? They’re…</b><br>Но a watch — один предмет: <b>Where’s the watch? It’s on the desk.</b></p></div>`,2:'<p class="lead">Посмотри на картинку и выбери in, on или under.</p>',3:'<p class="lead">Выбери начало вопроса: Where is или Where are.</p>',4:'<p class="lead">Выбери ответ по картинке. Проверяй и предлог, и It’s / They’re.</p>',5:'<p class="lead">Вспомни: один предмет — is / It’s; несколько или множественная форма — are / They’re.</p>',6:'<p class="lead">Нажимай слова по порядку. «Убрать» отменяет последнее слово.</p>',7:`<p class="lead">Где мои вещи? Рассмотри рабочее место и напиши ответы. Каждая зона показывает предмет и его расположение.</p><div class="gallery">${detective.map(picture).join('')}</div>`,8:`<p class="lead">Запомни расположение предметов, затем скрой картинку.</p><button id="memoryToggle" class="alt">Скрыть картинку</button><div id="memoryScene" class="gallery">${memory.map(picture).join('')}</div>`,9:`<p class="lead">Мы опаздываем! Найди вещи и заполни диалог.</p><div class="gallery">${[[4,'in','bag'],[2,'under','notebook',2],[24,'on','desk']].map(picture).join('')}</div>`,10:'<p class="lead">Напиши вопрос и ответ. Полные и сокращённые формы принимаются; регистр и пунктуация не влияют на проверку.</p><div class="note">Пример: Where’s the phone? It’s in the bag.<br>Выбирай It’s / They’re по английскому слову: <b>watch → It’s</b>, <b>glasses → They’re</b>.</div>',11:'<p class="lead">После любого выбора появятся правильный ответ и объяснение.</p>'};
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function norm(s){return String(s).toLowerCase().replace(/[’‘]/g,"'").replace(/\bit's\b/g,'it is').replace(/\bthey're\b/g,'they are').replace(/\bwhat's\b/g,'what is').replace(/\bwhere's\b/g,'where is').replace(/[^a-z0-9\s|]/g,' ').replace(/\s+/g,' ').trim()}

function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){document.getElementById('storageNote').textContent='Сохранение ограничено браузером: прогресс доступен до закрытия страницы.'}}
function update(){let q=Object.values(tasks),n=q.filter(t=>state.solved[t.id]).length;document.getElementById('bar').style.width=n/q.length*100+'%';document.getElementById('stats').textContent=`Решено ${n} / ${q.length} · Ошибок для повторения: ${Object.keys(state.mistakes).length}`;document.querySelectorAll('nav button').forEach((b,i)=>{let a=q.filter(t=>t.s===i);b.classList.toggle('active',state.section===i);b.classList.toggle('done',a.length?a.every(t=>state.solved[t.id]):!!state.read[i])});save()}
function fb(t){let ok=state.solved[t.id],model=t.type==='gaps'?t.groups.map((g,i)=>`${i+1}. ${g[0]}`).join('; '):t.answers[0];return `<b>${ok?'✓ Верно!':'Попробуй ещё раз.'}</b><br>${esc(t.why)}${!ok||t.auto?'<br><b>Правильный ответ:</b> '+esc(model):''}`}
function taskHTML(t,n){let a=state.answers[t.id]||'';return `<div class="task ${state.solved[t.id]?'solved':''}" id="${t.id}"><div class="context">${n+1} · ${esc(t.group||'Практика')}</div><label class="prompt" for="input-${t.id}">${esc(t.prompt)}</label>${t.scene?picture(t.scene):''}${t.type==='choice'?`<div class="answers">${t.opts.map(o=>`<button data-choice="${t.id}" data-value="${esc(o)}" aria-pressed="${a===o}" class="${a===o?'selected':''}">${esc(o)}</button>`).join('')}</div>`:t.type==='order'?`<div class="built">${esc(Array.isArray(a)?a.map(i=>t.tokens[i]).join(' '):'')}</div><div class="answers">${t.tokens.map((o,i)=>`<button data-token="${t.id}" data-index="${i}" ${Array.isArray(a)&&a.includes(i)?'disabled':''}>${esc(o)}</button>`).join('')}<button class="alt" data-undo="${t.id}">← Убрать</button></div>`:t.type==='gaps'?`<div class="blankrow">${t.groups.map((g,i)=>`<label>Пропуск ${i+1}<input data-gap="${t.id}" data-index="${i}" value="${esc(Array.isArray(a)?a[i]||'':'')}" aria-label="Пропуск ${i+1}" autocomplete="off"></label>`).join('')}</div>`:`<input id="input-${t.id}" data-input="${t.id}" value="${esc(a)}" placeholder="Your answer…" autocomplete="off" spellcheck="false">`}${t.auto?'':`<button data-check="${t.id}">Проверить</button>`}<div class="feedback ${state.checked[t.id]?(state.solved[t.id]?'good':'bad'):''}" id="feedback-${t.id}" role="status" aria-live="polite">${state.checked[t.id]?fb(t):''}</div></div>`}
function render(){let s=state.section,q=Object.values(tasks).filter(t=>t.s===s&&(!state.retry||state.mistakes[t.id]));document.getElementById('nav').innerHTML=titles.map((t,i)=>`<button data-nav="${i}">${i+1} · ${t}</button>`).join('');document.getElementById('main').innerHTML=`<article><div class="eyebrow">ШАГ ${s+1} / 12</div><h2>${titles[s]}</h2><button id="retry" class="alt">${state.retry?'Показать все задания':'Только задания с ошибками'}</button>${theory[s]}${state.retry&&!q.length?'<div class="note">Нет заданий для повторения ✓</div>':''}${q.map(taskHTML).join('')}${s<2?`<button id="read">${state.read[s]?'✓ Изучено':'Отметить изученным'}</button>`:''}<footer><button data-nav="${Math.max(0,s-1)}" class="alt" ${s===0?'disabled':''}>← Назад</button><button data-nav="${Math.min(11,s+1)}" ${s===11?'disabled':''}>Далее →</button></footer><p class="small">A1 · In / on / under · Все картинки встроены. Интернет не нужен.<br>В Holst требуется поддержка HTML и JavaScript.</p></article>`;if(s===8){document.getElementById('memoryScene').hidden=state.hidden;document.getElementById('memoryToggle').textContent=state.hidden?'Показать картинку':'Скрыть картинку'}update()}
function clear(id){delete state.solved[id];delete state.checked[id];document.getElementById('feedback-'+id).innerHTML='';document.getElementById(id).classList.remove('solved');update()}
function check(id){let t=tasks[id],a=state.answers[id],f=document.getElementById('feedback-'+id);if(t.type==='order')a=Array.isArray(a)?a.map(i=>t.tokens[i]).join(' '):'';if(t.type==='gaps'){if(!Array.isArray(a)||a.length!==t.groups.length||a.some(x=>!x.trim())){f.className='feedback bad';f.textContent='Заполни каждый пропуск.';return}}else if(!a||!a.trim()){f.className='feedback bad';f.textContent='Сначала заполни ответ.';return}let ok=t.type==='gaps'?t.groups.every((g,i)=>g.some(x=>norm(x)===norm(a[i]))):t.answers.some(x=>norm(x)===norm(a));state.solved[id]=ok;state.checked[id]=true;if(ok)delete state.mistakes[id];else state.mistakes[id]=true;f.className='feedback '+(ok?'good':'bad');f.innerHTML=fb(t);document.getElementById(id).classList.toggle('solved',ok);update()}
document.addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;let d=b.dataset;if(d.nav!==undefined){state.section=+d.nav;render();window.scrollTo({top:document.querySelector('.layout').offsetTop,behavior:'smooth'})}if(d.choice){state.answers[d.choice]=d.value;b.parentElement.querySelectorAll('button').forEach(x=>{x.classList.toggle('selected',x===b);x.setAttribute('aria-pressed',x===b)});clear(d.choice);if(tasks[d.choice].auto)check(d.choice)}if(d.check)check(d.check);if(d.token||d.undo){let id=d.token||d.undo,a=Array.isArray(state.answers[id])?state.answers[id]:[];if(d.token)a.push(+d.index);else a.pop();state.answers[id]=a;delete state.solved[id];delete state.checked[id];let y=window.scrollY;render();window.scrollTo(0,y)}if(b.id==='retry'){state.retry=!state.retry;render()}if(b.id==='memoryToggle'){state.hidden=!state.hidden;document.getElementById('memoryScene').hidden=state.hidden;b.textContent=state.hidden?'Показать картинку':'Скрыть картинку';save()}if(b.id==='read'){state.read[state.section]=true;b.textContent='✓ Изучено';update()}if(b.id==='reset'&&confirm('Сбросить все ответы и прогресс?')){state={section:0,answers:{},solved:{},checked:{},read:{},mistakes:{},hidden:false,retry:false};render()}if(b.id==='download'){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['<!doctype html>\n'+document.documentElement.outerHTML],{type:'text/html;charset=utf-8'}));a.download='Prepositions_A1.html';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}});
document.addEventListener('input',e=>{let d=e.target.dataset;if(d.input){state.answers[d.input]=e.target.value;clear(d.input)}if(d.gap){let a=Array.isArray(state.answers[d.gap])?state.answers[d.gap]:Array(tasks[d.gap].groups.length).fill('');a[+d.index]=e.target.value;state.answers[d.gap]=a;clear(d.gap)}});document.addEventListener('keydown',e=>{if(e.key==='Enter'&&(e.target.dataset.input||e.target.dataset.gap))check(e.target.dataset.input||e.target.dataset.gap)});render();
</script></html>
