<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Listening 2.2 | AEF Level 2</title>
<style>
:root{color-scheme:light;--ink:#292b3d;--accent:#544682;--line:#dcd6e9;--surface:#fff}
*{box-sizing:border-box}
body{margin:0;background:#f6f3fa;color:var(--ink);font:1rem/1.6 system-ui,sans-serif}
main{max-width:1120px;margin:auto;padding:34px 22px 54px;display:grid;grid-template-columns:minmax(240px,1fr) minmax(0,2.6fr);gap:22px;align-items:start}
aside,article{border:1px solid var(--line);border-radius:22px}
aside{position:sticky;top:18px;background:#ede8f7;padding:20px;z-index:1}
article{background:var(--surface);padding:clamp(18px,4vw,40px)}
.eyebrow{margin:0;color:var(--accent);font-size:.84rem;font-weight:700}
h1{font-size:clamp(1.4rem,4vw,2.1rem);line-height:1.18;margin:.4em 0}
h2{font-size:1.25rem;margin:0 0 .5rem}
audio{display:block;width:100%;height:44px}
.actions{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
#audio-file{display:block;max-width:100%;margin:.3rem 0 .55rem;font:inherit;font-size:.84rem} #picker-label{font-weight:650;font-size:.84rem} .player{margin-top:10px;display:grid;grid-template-columns:1fr 1.5fr 1fr}
button{font:inherit;font-weight:650;cursor:pointer;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink);padding:.45em .7em}
button.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
button:disabled{opacity:.55;cursor:default}
button:focus-visible,input:focus-visible{outline:3px solid #785ac0;outline-offset:2px}
#script p{line-height:2.45;margin:1.05rem 0}
.gap{display:inline-flex;align-items:center;gap:4px;max-width:100%;vertical-align:middle;white-space:nowrap}
.number{font-size:.7rem;color:var(--accent);font-weight:700}
.gap input{font:inherit;line-height:1.3;width:var(--field);max-width:calc(100vw - 95px);border:1px solid #c0b6d7;border-radius:7px;padding:.32em .46em;background:#f8f6fd;color:var(--ink);scroll-margin-top:155px}
.gap[data-state="correct"] input{background:#e6f4e9;border-color:#36744a}
.gap[data-state="retry"] input{background:#fff0eb;border-color:#a3483e}
.gap[data-state="blank"] input{background:#fff6dc;border-color:#927123}
.mark{font-size:.7rem;font-weight:700}
.mark:empty{display:none}
#feedback,#audio-error{margin:.6rem 0 0;font-weight:650}
#feedback:empty,#audio-error:empty{display:none}
footer{border-top:1px solid var(--line);padding-top:18px}
@media(max-width:740px){
main{display:block;padding:10px 12px 24px}
aside{top:0;padding:8px 12px;border-radius:14px}
aside h2{font-size:1rem;margin:0}
.player{margin-top:5px}
article{margin-top:12px}
}
</style>
</head>
<body>
<main>
<aside aria-label="Audio player">
<h2>Audio 2.2</h2>
<label for="audio-file" id="picker-label">Choose audio 2.2 (MP3)</label><input id="audio-file" type="file" accept="audio/mpeg,.mp3"><audio id="track" controls preload="metadata"></audio>
<div class="actions player">
<button type="button" id="back" aria-label="Back five seconds" disabled>−5 sec</button>
<button type="button" id="toggle" class="primary" disabled>Play</button>
<button type="button" id="forward" aria-label="Forward five seconds" disabled>+5 sec</button>
</div>
<p id="audio-error" role="status"></p>
</aside>
<article>
<header>
<p class="eyebrow">American English File · Level 2</p>
<h1>Task 1 – Listen and fill in the gaps</h1>
<p>Listen to audio 2.2 and type the missing words or phrases.</p>
</header>
<div id="script"></div>
<footer>
<div class="actions">
<button type="button" class="primary" id="check">Check answers</button>
<button type="button" id="reset">Start over</button>
</div>
<p id="feedback" role="status"></p>
</footer>
</article>
</main>
<script>
const paragraphs = [
  "This {happened} two years ago. I’m Spanish, but I was in Ireland {at the time} because I had a job in Dublin. Some {friends of mine} who lived in Lyon, in France, invited me to come and stay, so I decided to {take a short vacation}, a long weekend, from Friday to Tuesday. I looked for {cheap flights}, but I couldn’t find any {direct ones}. The only thing I could find was Ryanair from Dublin to Brussels, and then Air France from Brussels to Lyon.",
  "Anyway, the flight to Brussels was fine, and when I arrived, I went to {the gate} for my next flight to Lyon, but then, when I needed to show my {boarding pass} and my ID, I couldn’t find my ID card. I {looked everywhere} – in my bag, in my suitcase – but it wasn’t there. The people at the gate were very nice and they {made some phone calls}, but nobody could find it. So they {told me to wait} in a small room and I sat there for more than an hour, and my flight to Lyon {left without me}.",
  "It was {awful} – I cried – I was so stressed and unhappy. {In the end}, a police officer came and he said that I couldn’t go to France because I didn’t have any ID – the only place I could go was to Spain to get a new ID card! I waited {another five or six hours} for the flight to Madrid, feeling very depressed.",
  "So I never took my vacation! I {spent the weekend} in Madrid getting my new ID card!"
];
const script = document.querySelector("#script");
const feedback = document.querySelector("#feedback");
const gaps = [];

function showState(gap, state) {
  gap.label.dataset.state = state;
  gap.mark.textContent = {correct: "OK", retry: "Retry", blank: "Blank"}[state] || "";
  gap.input.setAttribute("aria-invalid", String(state === "retry" || state === "blank"));
}

for (const paragraph of paragraphs) {
  const line = document.createElement("p");
  paragraph.split(/\{([^}]+)\}/).forEach((part, index) => {
    if (index % 2 === 0) {
      line.append(part);
      return;
    }
    const number = gaps.length + 1;
    const label = document.createElement("label");
    label.className = "gap";
    label.style.setProperty("--field", Math.max(7, part.length + 2) + "ch");
    const badge = document.createElement("span");
    badge.className = "number";
    badge.textContent = number;
    badge.setAttribute("aria-hidden", "true");
    const input = document.createElement("input");
    input.type = "text";
    input.autocomplete = "off";
    input.spellcheck = false;
    input.setAttribute("autocapitalize", "none");
    input.setAttribute("aria-label", "Gap " + number);
    const mark = document.createElement("span");
    mark.className = "mark";
    mark.id = "mark-" + number;
    input.setAttribute("aria-describedby", mark.id);
    label.append(badge, input, mark);
    line.append(label);
    const gap = {input, label, mark, answer: part};
    gaps.push(gap);
    input.addEventListener("input", () => {
      showState(gap, "");
      feedback.textContent = "";
    });
  });
  script.append(line);
}

function normalize(value) {
  return value.trim().toLowerCase().replace(/\s+/g, " ").replace(/[.,!?]+$/, "");
}

document.querySelector("#check").addEventListener("click", () => {
  let correct = 0;
  for (const gap of gaps) {
    let value = normalize(gap.input.value);
    if (gap.answer === "another five or six hours") {
      value = value.replace(/\b5\b/g, "five").replace(/\b6\b/g, "six");
    }
    if (value === normalize(gap.answer)) {
      correct++;
      showState(gap, "correct");
    } else {
      showState(gap, value ? "retry" : "blank");
    }
  }
  feedback.textContent = correct + " / " + gaps.length + " correct. " +
    (correct === gaps.length ? "All done!" : "Listen again and try the remaining gaps.");
});

document.querySelector("#reset").addEventListener("click", () => {
  for (const gap of gaps) {
    gap.input.value = "";
    showState(gap, "");
  }
  feedback.textContent = "";
  gaps[0].input.focus();
});

const track = document.querySelector("#track");
const toggle = document.querySelector("#toggle");
const back = document.querySelector("#back");
const forward = document.querySelector("#forward");
const audioError = document.querySelector("#audio-error");
let objectUrl;
document.querySelector("#audio-file").addEventListener("change", (event) => {
  const file = event.target.files[0];
  if (!file) return;
  if (objectUrl) URL.revokeObjectURL(objectUrl);
  objectUrl = URL.createObjectURL(file);
  track.src = objectUrl;
  audioError.textContent = "";
  track.load();
  syncPlayer();
});

function syncPlayer() {
  toggle.textContent = track.paused || track.ended ? "Play" : "Pause";
  const ready = track.readyState >= 1 && Number.isFinite(track.duration) && !track.error;
  for (const button of [toggle, back, forward]) button.disabled = !ready;
}
for (const event of ["loadedmetadata", "durationchange", "play", "pause", "ended"]) {
  track.addEventListener(event, syncPlayer);
}
track.addEventListener("error", () => {
  audioError.textContent = "The audio could not load. Try opening the file in your browser.";
  syncPlayer();
});
toggle.addEventListener("click", async () => {
  if (!track.paused && !track.ended) {
    track.pause();
    return;
  }
  try {
    await track.play();
    audioError.textContent = "";
  } catch {
    audioError.textContent = "The audio could not start. Try the Play button in the audio bar.";
  }
});
function skip(seconds) {
  track.currentTime = Math.min(track.duration, Math.max(0, track.currentTime + seconds));
}
back.addEventListener("click", () => skip(-5));
forward.addEventListener("click", () => skip(5));
syncPlayer();
</script>
</body>
</html>
